// Equalize all string lengths (anchors assumed fixed).  Each string is owned by
// one rod (its end -> a fixed hole), so making every rod's two end-strings equal
// to a common length mu makes ALL strings = mu, fixing both per-rod (case 1) and
// per-anchor (case 2) imbalance.  For a target mu, "both ends at distance mu from
// their holes" is two linear constraints on the rod direction d, |d|=1:
//   a+.d = p+(mu),  a-.d = p-(mu)   (a± = P - H±)
// whose min-norm in-plane part d_par is feasible iff |d_par| <= 1; the feasible
// mu form an interval [lo,hi] per rod.  We use the smallest mu every rod can
// reach (= max of the per-rod lo's) -> equal AND as taut as equal allows.
// Returns a direction per rod (parallel to `rods`); non-solvable rods keep dir.
function strEqualizeDirs(rods, anchorByKey, quiet) {
  const info = rods.map(rod => {
    const Hm = anchorByKey.get(rod.keyMinus), Hp = anchorByKey.get(rod.keyPlus);
    if (!Hm || !Hp) return { ok: false };
    const ap = rod.P.clone().sub(Hp), am = rod.P.clone().sub(Hm);   // a+ , a-
    const g11 = ap.dot(ap), g22 = am.dot(am), g12 = ap.dot(am);
    const det = g11 * g22 - g12 * g12;
    if (det < 1e-9) return { ok: false };                            // holes collinear with anchor
    const Lp = rod.Lplus, Lm = rod.Lminus;
    const up =  1 / (2 * Lp), vp = -(Lp * Lp + g11) / (2 * Lp);      // p+ = up*s + vp  (s = mu^2)
    const um = -1 / (2 * Lm), vm =  (Lm * Lm + g22) / (2 * Lm);      // p- = um*s + vm
    // |d_par|^2 = (g22 p+^2 - 2 g12 p+ p- + g11 p-^2)/det ; set = 1 -> A s^2 + B s + C = 0
    const A = g22 * up * up - 2 * g12 * up * um + g11 * um * um;
    const B = 2 * g22 * up * vp - 2 * g12 * (up * vm + um * vp) + 2 * g11 * um * vm;
    const C = g22 * vp * vp - 2 * g12 * vp * vm + g11 * vm * vm - det;
    const disc = B * B - 4 * A * C;
    if (A <= 0 || disc < 0) return { ok: false };                    // never equalizable
    const sq = Math.sqrt(disc);
    const lo = Math.sqrt(Math.max((-B - sq) / (2 * A), 0));
    const hi = Math.sqrt(Math.max((-B + sq) / (2 * A), 0));
    return { ok: true, rod, ap, am, g11, g22, g12, det, up, vp, um, vm, lo, hi };
  });

  // Per-ring target: rods whose anchors share a ring (same diagram height) are
  // congruent, so equalize them among themselves — each ring gets its own mu =
  // the smallest length its rods can reach.  (A single global mu is infeasible
  // for C>=2: the rings' feasible ranges don't overlap.)
  const ringMu = new Map();
  info.forEach((d, i) => {
    if (!d.ok) return;
    const k = rods[i].ringY;
    ringMu.set(k, Math.max(ringMu.get(k) ?? 0, d.lo));
  });
  const muList = [...ringMu.entries()].sort((a, b) => a[0] - b[0]);
  if (!quiet) console.log(`equalize per-ring: rings=${ringMu.size}  ring-mu=[${muList.map(e => e[1].toFixed(2)).join(', ')}]`);

  return info.map((d, i) => {
    if (!d.ok) return rods[i].dir.clone();          // keep current direction
    const m = Math.min(Math.max(ringMu.get(rods[i].ringY) ?? d.lo, d.lo), d.hi);  // per-ring target
    const s = m * m;
    const pp = d.up * s + d.vp, pm = d.um * s + d.vm;
    const alpha = ( d.g22 * pp - d.g12 * pm) / d.det;
    const beta  = (-d.g12 * pp + d.g11 * pm) / d.det;
    const dpar = d.ap.clone().multiplyScalar(alpha).addScaledVector(d.am, beta);
    const n = d.ap.clone().cross(d.am).normalize();
    const t = Math.sqrt(Math.max(1 - dpar.lengthSq(), 0));
    const d1 = dpar.clone().addScaledVector(n,  t);
    const d2 = dpar.clone().addScaledVector(n, -t);
    // Of the two equal-length solutions, keep the one whose ends stay farther from
    // the cylinder axis (rod bulges outward).  That's the non-self-intersecting
    // branch and a stable choice as the sliders change — avoids the flip where a
    // rod dives inward through the others.
    const outwardness = dd => {
      const a = d.rod.P.clone().addScaledVector(dd, -d.rod.Lminus);
      const b = d.rod.P.clone().addScaledVector(dd,  d.rod.Lplus);
      return a.x * a.x + a.y * a.y + b.x * b.x + b.y * b.y;
    };
    return (outwardness(d1) >= outwardness(d2) ? d1 : d2).normalize();
  });
}

// Tensegrity form-finding by dynamic relaxation.  Rods are rigid struts (fixed
// length, hole at the midpoint); every cable (a rod end -> a hole) is a spring
// with the common rest length mu.  Relax to force/torque equilibrium: cables in
// tension pull, the rigid struts resist, and the structure settles into the
// natural prestressed shape.  It can't collapse: a cable shorter than mu pushes
// back, so the struts stay propped apart.  Symmetric init + symmetric forces keep
// the result symmetric.  mu sets how tight the cables are.  Returns {P, d}.
function strFormFind(rods, t0, t1, initDirs, mu) {
  const N = rods.length;
  const P = rods.map(r => r.P.clone());
  const d = rods.map((r, i) => initDirs[i].clone());
  const L = rods.map(r => r.Lminus);            // symmetric: Lminus == Lplus
  const endP = (i, s) => P[i].clone().addScaledVector(d[i], s * L[i]);

  const ITERS = 500, eta = 0.1, cap = 0.12 * mu;
  for (let it = 0; it < ITERS; it++) {
    const F = Array.from({ length: N }, () => new THREE.Vector3());
    const T = Array.from({ length: N }, () => new THREE.Vector3());
    for (let i = 0; i < N; i++) {
      for (const [s, ti] of [[-1, t0[i]], [1, t1[i]]]) {
        if (ti < 0) continue;
        const E = endP(i, s), H = P[ti];
        const vec = new THREE.Vector3().subVectors(H, E);
        const len = vec.length();
        if (len < 1e-9) continue;
        const force = vec.multiplyScalar((len - mu) / len);   // k=1; tension when len>mu
        F[i].add(force);
        T[i].add(new THREE.Vector3().subVectors(E, P[i]).cross(force));
        F[ti].sub(force);                                     // reaction on the hole's rod
      }
    }
    for (let i = 0; i < N; i++) {
      const step = F[i].multiplyScalar(eta);
      if (step.length() > cap) step.setLength(cap);
      P[i].add(step);
      const tl = T[i].length();
      if (tl > 1e-9) {
        let ang = eta * tl; if (ang > 0.2) ang = 0.2;
        d[i].applyAxisAngle(T[i].multiplyScalar(1 / tl), ang).normalize();
      }
    }
  }
  return { P, d };
}

// Build mode: trace the single string loop through the tensegrity.  The string
// threads each tube twice — once along the tube (end to end) and once through
// its middle hole — so the build is a sequence of tube-passes, each tagged
// via:'tube' (along) or via:'hole' (through the middle); strings are implicit.
// Returns { tubes, rodNum, firstIdx }: the ordered tube-passes, each rod's
// first-appearance number (1-based; 0 = not in loop), and each rod's first
// tube-pass index.  `allow(i)` limits to the drawn component.
function traceBuildLoop(rods, t0, t1, allow) {
  const R = rods.length;
  const incoming = Array.from({ length: R }, () => []);   // ends whose string ends at hole i
  for (let i = 0; i < R; i++) {
    if (!allow(i)) continue;
    if (t0[i] >= 0 && allow(t0[i])) incoming[t0[i]].push([i, 0]);
    if (t1[i] >= 0 && allow(t1[i])) incoming[t1[i]].push([i, 1]);
  }
  let start = -1, topY = -Infinity;                        // start at a top rod
  for (let i = 0; i < R; i++) {
    if (allow(i) && rods[i].ringY > topY) { topY = rods[i].ringY; start = i; }
  }
  const seq = [];
  const rodNum = new Array(R).fill(0), firstIdx = new Array(R).fill(-1);
  if (start < 0) return { tubes: seq, rodNum, firstIdx };
  let cr = start, ce = 0;
  for (let g = 0; g < 4 * R + 4; g++) {
    const oe = 1 - ce;
    seq.push({ rod: cr, via: 'tube' });                    // along the tube (end to end)
    const H = oe === 0 ? t0[cr] : t1[cr];
    if (H < 0 || !allow(H)) break;
    const other = incoming[H].find(([r, e]) => !(r === cr && e === oe));
    if (!other) break;
    seq.push({ rod: H, via: 'hole' });                     // through the middle (hole)
    cr = other[0]; ce = other[1];
    if (cr === start && ce === 0) break;                   // loop closed
  }
  let n = 0;
  seq.forEach((el, k) => {
    if (rodNum[el.rod] === 0) { rodNum[el.rod] = ++n; firstIdx[el.rod] = k; }
  });
  return { tubes: seq, rodNum, firstIdx };   // tubes: ordered tube-passes (strings implicit)
}

// A billboarded number tag (always faces the camera), drawn always-on-top.
function makeNumberSprite(text, color, alpha, worldSize) {
  const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d');
  c.font = 'bold 88px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 8; c.strokeStyle = 'rgba(0,0,0,0.85)'; c.strokeText(text, S / 2, S / 2);
  c.fillStyle = `#${color.getHexString()}`; c.fillText(text, S / 2, S / 2);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: alpha, depthTest: false, depthWrite: false }));
  sp.renderOrder = 1000;
  sp.scale.setScalar(worldSize);
  return sp;
}

// Each over-crossing's strand-piece (split at the under-crossings, with its bight
// straightened) is one straight rod tangent to a reference cylinder at the
// crossing (the "anchor").  Tensegrity: these are the rods; strings come later.
function buildStraight() {
  while (knotGroup.children.length) {
    const child = knotGroup.children[0];
    child.geometry.dispose();
    if (child.material.map) child.material.map.dispose();   // sprite tags
    child.material.dispose(); knotGroup.remove(child);
  }
  knotGroup.rotation.set(-Math.PI / 2, 0, 0);   // cylinder axis (local z) -> vertical, side view
  knotGroup.scale.setScalar(1);                  // reset; we fit-scale at the end

  const B   = parseInt(document.getElementById('bInput').value);
  const mod  = 2 * currentC * B;
  const tubeRadius = parseFloat(document.getElementById('thickInput').value);

  const aspect = innerWidth / innerHeight;
  const camR   = 6.5;
  const pxToWorld = 2 * camR / innerHeight;
  // Axial scale is fixed (so total height stays put); the radius slider only
  // changes the angular scale -> the rod angles change.  At radius 260 the cells
  // are square (45°); smaller radius -> steeper rods, larger -> flatter.
  const heightRaw = parseFloat(document.getElementById('straightHeightSlider').value);
  const radiusRaw = parseFloat(document.getElementById('straightRadiusSlider').value);
  // Rod lengths are FIXED (physical tubes): built at a constant reference scale, so
  // the radius/height sliders move only the anchor positions, not the rods.
  const arcRef = 2 * Math.PI * (260 * pxToWorld) / mod;             // fixed rod-length scale
  const R = radiusRaw * pxToWorld;                                  // anchor radius
  const H = 2 * Math.PI * (heightRaw * pxToWorld) / mod * MAX_Y;    // anchor height spread
  orthoCamera.left = -camR * aspect; orthoCamera.right =  camR * aspect;
  orthoCamera.top  =  camR;          orthoCamera.bottom = -camR;
  orthoCamera.updateProjectionMatrix();

  const components   = generateAllComponents(B);
  const g            = components.length;
  const allCrossings = computeDiagramCrossingsAll(components, mod);
  updateInfo(B, g, allCrossings.crossingCount);
  const ct = document.getElementById('componentToggle');
  if (g === 1) { componentMode = false; ct.disabled = true; }
  else ct.disabled = false;
  ct.textContent = componentMode ? 'Full' : 'Solo';

  const yAxis = new THREE.Vector3(0, 1, 0);

  // Phase 1 gathers each rod; phase 2 orients them and draws rods + strings.
  // Every crossing point (x mod, y) hosts one over (a rod's anchor/hole) and one
  // under (where two rods' ends meet), so a rod end's hole is the anchor that
  // shares its under key.
  const keyOf = pos => `${(((Math.round(pos.x)) % mod) + mod) % mod},${Math.round(pos.y)}`;
  const rods = [];
  const anchorByKey = new Map();   // crossing key -> anchor (hole) 3D position

  for (let comp = 0; comp < g; comp++) {   // build the full tensegrity (Solo only hides at draw time)
    const bP = components[comp];
    const n  = bP.length;
    const crossMap = allCrossings[comp];

    // Cumulative x along the path (1:1 with |Δy| since segments are 45°).
    const X = [0];
    for (let k = 0; k < n; k++) X.push(X[k] + Math.abs(bP[(k + 1) % n][1] - bP[k][1]));
    const total = X[n];
    const x0 = bP[0][0];
    const segDir = k => Math.sign(bP[(k + 1) % n][1] - bP[k][1]);
    const posAt = p => {
      let pp = ((p % total) + total) % total;
      let k = 0; while (k < n - 1 && pp >= X[k + 1]) k++;
      return { x: x0 + p, y: bP[k][1] + segDir(k) * (pp - X[k]) };  // x unmodded -> theta continuity
    };

    // Crossings along the path in order.
    const crs = [];
    for (let k = 0; k < n; k++)
      for (const c of ((crossMap.get(k) || []).slice().sort((a, b) => a.t - b.t)))
        crs.push({ p: X[k] + c.t, isUnder: c.isUnder });
    crs.sort((a, b) => a.p - b.p);
    const nc = crs.length;
    const unders = crs.map((c, i) => (c.isUnder ? i : -1)).filter(i => i >= 0);
    if (unders.length === 0) continue;

    const color = new THREE.Color().setHSL(g === 1 ? 0.58 : comp / g, 0.9, 0.62);

    for (let ui = 0; ui < unders.length; ui++) {
      const iA = unders[ui], iB = unders[(ui + 1) % unders.length];
      let pA = crs[iA].p, pB = crs[iB].p;
      if (pB <= pA) pB += total;
      // First over-crossing in (pA, pB) is the anchor.
      let anchorP = null;
      for (let j = iA + 1; (j % nc) !== iB; j++) {
        if (!crs[j % nc].isUnder) { anchorP = crs[j % nc].p; if (anchorP < pA) anchorP += total; break; }
      }
      if (anchorP === null) continue;

      // Bight vertices strictly inside (pA, pB) — 0 or 1 for C=1.
      const bights = [];
      for (let k = 0; k < n; k++) for (const off of [0, total]) {
        const bp = X[k] + off; if (bp > pA + 1e-9 && bp < pB - 1e-9) bights.push(bp);
      }

      const A = posAt(pA), Bd = posAt(pB);
      const anchorPos = posAt(anchorP);
      // The rod is the straight arm holding the anchor: from the anchor out to
      // the nearest bight on each side, or to the bounding under if none.  (At
      // small leads a single under-to-under piece can contain several bights.)
      // Each discarded stub beyond a bight still belongs to its bounding under
      // (pA/pB), which is where that end's string attaches.
      let bBefore = null, bAfter = null;
      for (const bp of bights) {
        if (bp < anchorP) { if (bBefore === null || bp > bBefore) bBefore = bp; }
        else              { if (bAfter  === null || bp < bAfter ) bAfter  = bp; }
      }
      const e0 = bBefore !== null ? posAt(bBefore) : A;
      const e1 = bAfter  !== null ? posAt(bAfter)  : Bd;

      // Anchor (hole) sits on the cylinder at (radius R, height H); these move with
      // the sliders.  The rod's arm vectors use the FIXED arcRef scale, so its
      // lengths and reference direction don't change with R/H — only its anchor
      // does.  Each end belongs to the under bounding its piece (pA/pB) — even a
      // bight end, whose discarded stub led to that under — so its hole is the
      // anchor at that key.
      const theta = (anchorPos.x / mod) * 2 * Math.PI - Math.PI / 2;
      const P = new THREE.Vector3(R * Math.cos(theta), R * Math.sin(theta), (anchorPos.y / MAX_Y - 0.5) * H);
      const Tang = new THREE.Vector3(-Math.sin(theta), Math.cos(theta), 0);
      const armVec = e => new THREE.Vector3()
        .addScaledVector(Tang, arcRef * (e.x - anchorPos.x))
        .add(new THREE.Vector3(0, 0, arcRef * (e.y - anchorPos.y)));
      const v0 = armVec(e0), v1 = armVec(e1);
      if (v0.length() + v1.length() < 1e-6) continue;
      const dir = new THREE.Vector3().subVectors(v1, v0).normalize();
      // Put the hole at the rod's midpoint: cut the longer arm down to the shorter,
      // so equal cable tension is balanced (no torque -> the rod won't rotate to one
      // side).  For C=1 the arms are already equal, so this changes nothing there.
      const L = Math.min(v0.length(), v1.length());
      if (L < 1e-6) continue;
      const dLen = 2 * Math.round(Math.min(Math.abs(anchorPos.y - e0.y), Math.abs(e1.y - anchorPos.y)));

      anchorByKey.set(keyOf(anchorPos), P);
      rods.push({ P, dir, Lminus: L, Lplus: L, theta, yFrac: anchorPos.y / MAX_Y - 0.5,
                  ringY: Math.round(anchorPos.y), comp,
                  diagLen: dLen,   // rod length in diagonal units (integer, symmetric about the hole)
                  keyAnchor: keyOf(anchorPos), keyMinus: keyOf(A), keyPlus: keyOf(Bd), color });
    }
  }

  // Disable Uniform when the rods are already a single length (nothing to cut).
  document.getElementById('uniformToggle').disabled =
    rods.length > 0 && rods.every(r => r.diagLen === rods[0].diagLen);

  // Uniform: cut every rod down to the shortest rod's length (still centered on
  // the hole), so all struts are equal length.
  if (straightUniform && rods.length) {
    const minL = Math.min(...rods.map(r => r.Lminus));
    const minD = Math.min(...rods.map(r => r.diagLen));
    rods.forEach(r => { r.Lminus = minL; r.Lplus = minL; r.diagLen = minD; });
  }

  // Map each anchor key to its rod, so a rod end knows which rod's anchor is its
  // hole.  t0/t1 = hole rod index for the e0/e1 ends (-1 if missing).
  const idxByKey = new Map();
  rods.forEach((r, i) => idxByKey.set(r.keyAnchor, i));
  const t0 = rods.map(r => idxByKey.has(r.keyMinus) ? idxByKey.get(r.keyMinus) : -1);
  const t1 = rods.map(r => idxByKey.has(r.keyPlus ) ? idxByKey.get(r.keyPlus ) : -1);

  const eqDirs = strEqualizeDirs(rods, anchorByKey);   // equalize (Equal mode + form-finding init)

  // Cable lengths for a given set of positions + directions.
  const lensFor = (Parr, darr) => {
    const a = [];
    for (let i = 0; i < rods.length; i++) {
      const e0 = Parr[i].clone().addScaledVector(darr[i], -rods[i].Lminus);
      const e1 = Parr[i].clone().addScaledVector(darr[i],  rods[i].Lplus);
      if (t0[i] >= 0) a.push(e0.distanceTo(Parr[t0[i]]));
      if (t1[i] >= 0) a.push(e1.distanceTo(Parr[t1[i]]));
    }
    return a;
  };

  // Final per-rod positions + orientations: Optimize -> tensegrity form-finding
  // (relax to force equilibrium); Equal -> per-ring equalize; else raw.  Solo
  // computes the full tensegrity and only hides the other components at draw time.
  let df;
  if (straightOpt) {
    const eqL0 = lensFor(rods.map(r => r.P), eqDirs);
    const initMean = eqL0.reduce((x, y) => x + y, 0) / (eqL0.length || 1);
    const s = parseFloat(document.getElementById('straightLambdaSlider').value);  // 0 tight .. 1 loose
    const mu = (0.45 + 0.55 * s) * initMean;   // stay tension-dominated (avoid the loose blow-up)
    const ff = strFormFind(rods, t0, t1, eqDirs, mu);
    rods.forEach((r, i) => r.P.copy(ff.P[i]));      // move anchors to the equilibrium
    // Orientations: force-balance (from the relaxation), or — with Even on — rotate
    // each rod to equalize its two end-strings (a free mechanism at uniform tension,
    // doesn't move the anchors).
    df = straightEven ? strEqualizeDirs(rods, anchorByKey, true) : ff.d;
  } else {
    df = rods.map(r => r.dir);
  }
  const Pf = rods.map(r => r.P);

  // Report the displayed config's cable lengths (vs the default-cylinder raw total).
  {
    const sum = a => a.reduce((x, y) => x + y, 0);
    const Rref = 260 * pxToWorld, Hdef = arcRef * MAX_Y;
    const Pdef = rods.map(r => new THREE.Vector3(
      Rref * Math.cos(r.theta), Rref * Math.sin(r.theta), r.yFrac * Hdef));
    const rawDefT = sum(lensFor(Pdef, rods.map(r => r.dir)));
    const cl = lensFor(Pf, df), tot = sum(cl);
    console.log(`strings=${tot.toFixed(1)}  rawDefault=${rawDefT.toFixed(1)}  ` +
                `ratio=${(tot / rawDefT).toFixed(3)}  ` +
                `min=${Math.min(...cl).toFixed(2)} max=${Math.max(...cl).toFixed(2)}`);
    const tally = new Map();
    cl.forEach(v => { const k = v.toFixed(2); tally.set(k, (tally.get(k) || 0) + 1); });
    const sTally = [...tally.entries()].sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]));
    console.log(`distinct string lengths (${sTally.length}): ${sTally.map(([v, n]) => `${v}×${n}`).join('  ')}`);
  }

  // On-screen: rods grouped by length (integer diagonal units), under the bights.
  {
    const t = new Map();
    rods.forEach(r => t.set(r.diagLen, (t.get(r.diagLen) || 0) + 1));
    const groups = [...t.entries()].sort((a, b) => a[0] - b[0]);
    const el = document.getElementById('infoRods');
    el.textContent = 'rods: ' + groups.map(([len, n]) => `${n}×${len}`).join('  ·  ');
    el.style.display = '';
  }

  // ── Build mode: trace the string loop as a sequence of tube-passes; the cursor
  //    is a tube (strings are not counted).  Classify each tube built/current. ──
  const drawn = i => !componentMode || rods[i].comp === 0;
  let bRodNum = null, rodBuilt = null, rodCur = null, bLen = 0;
  if (buildMode) {
    const tr = traceBuildLoop(rods, t0, t1, drawn);
    const tubes = tr.tubes;
    bRodNum = tr.rodNum; bLen = tubes.length;
    if (bLen === 0) buildStep = 0; else buildStep = Math.max(0, Math.min(buildStep, bLen - 1));
    rodBuilt = new Array(rods.length).fill(false);
    rodCur   = new Array(rods.length).fill(false);
    tubes.forEach((el, k) => { if (k < buildStep) rodBuilt[el.rod] = true; else if (k === buildStep) rodCur[el.rod] = true; });
    const cur = tubes[buildStep];
    const info = document.getElementById('buildInfo');
    if (cur) {
      const isNew = tr.firstIdx[cur.rod] === buildStep;
      const via = cur.via === 'tube' ? 'along the tube' : 'through the middle';
      let txt = `Step ${buildStep + 1} / ${bLen} · tube #${bRodNum[cur.rod]} · ${via}`;
      txt += isNew ? ' · NEW' : ` · revisit (first at step ${tr.firstIdx[cur.rod] + 1})`;
      info.textContent = txt; info.style.display = '';
    } else info.style.display = 'none';
  } else {
    document.getElementById('buildInfo').style.display = 'none';
  }

  // ── Phase 2: draw rods, then strings. ───────────────────────────────────────
  const stringMat = new THREE.MeshPhongMaterial({ color: 0xffa53a, specular: 0x222222, shininess: 30 });
  const stringR = 0.035;   // fixed; the thin/thick slider changes rods only
  const drawString = (a, b) => {
    const sd = new THREE.Vector3().subVectors(b, a);
    const sl = sd.length();
    if (sl < 1e-6) return;
    const str = new THREE.Mesh(new THREE.CylinderGeometry(stringR, stringR, sl, 6, 1), stringMat);
    str.position.copy(a).addScaledVector(sd, 0.5);
    str.quaternion.setFromUnitVectors(yAxis, sd.clone().normalize());
    str.frustumCulled = false;
    knotGroup.add(str);
  };
  for (let i = 0; i < rods.length; i++) {
    if (componentMode && rods[i].comp !== 0) continue;   // Solo: draw one component only
    const rod = rods[i], P = Pf[i], d = df[i];
    const e0 = P.clone().addScaledVector(d, -rod.Lminus);
    const e1 = P.clone().addScaledVector(d,  rod.Lplus);
    const dir = new THREE.Vector3().subVectors(e1, e0);
    let rodColor = rod.color.clone();
    if (buildMode && bRodNum[i] > 0) { if (rodCur[i]) rodColor = B_CUR.clone(); else if (rodBuilt[i]) rodColor = B_BUILT.clone(); }
    const rodMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(tubeRadius, tubeRadius, dir.length(), 10, 1),
      new THREE.MeshPhongMaterial({ color: rodColor, specular: 0x333333, shininess: 40 }));
    rodMesh.position.copy(e0).addScaledVector(dir, 0.5);
    rodMesh.quaternion.setFromUnitVectors(yAxis, dir.clone().normalize());
    rodMesh.frustumCulled = false;
    knotGroup.add(rodMesh);
    // strings: each end -> its hole (the hole may belong to another, hidden component)
    if (t0[i] >= 0) drawString(e0, Pf[t0[i]]);
    if (t1[i] >= 0) drawString(e1, Pf[t1[i]]);
  }

  // Build mode: billboarded number tag on each rod in the loop (option c) —
  // current tube boldest, visited tubes bright, not-yet-visited faint.
  if (buildMode && bRodNum) {
    const tagSize = arcRef * MAX_Y * 0.05;
    for (let i = 0; i < rods.length; i++) {
      if (bRodNum[i] === 0 || (componentMode && rods[i].comp !== 0)) continue;
      const cur = rodCur[i], visited = rodBuilt[i] || cur;
      const col = cur ? B_CUR : visited ? B_TAG_V : B_TAG_U;
      const sp = makeNumberSprite(String(bRodNum[i]), col, cur ? 1 : visited ? 0.95 : 0.4,
                                  tagSize * (cur ? 1.4 : 1));
      sp.position.copy(Pf[i]);
      knotGroup.add(sp);
    }
  }

  // Fixed scale — based on the reference cylinder height only, so it does NOT
  // depend on the radius/height sliders.  That keeps the (fixed-length) rods at a
  // constant on-screen size, and the sliders visibly move the anchors instead of
  // rezooming the whole view.  Orbit/zoom if a large cylinder runs off-screen.
  const refH = arcRef * MAX_Y;
  knotGroup.scale.setScalar(refH > 1e-6 ? (2 * camR * 0.8) / refH : 1);
}

// Diagnostic: find C=3 pairs with identical bight y-coordinate sets.
// Call from browser console: findSameYSets(m)
window.findSameYSets = function(m) {
  if (currentC !== 3) { console.log('Switch to C=3 first'); return; }
  syncC3List(m);
  const L3 = 3 * m;
  const groups = new Map();
  // Even rotations (0,2,4) preserve ascending/descending roles; odd ones swap
  // them, so are not flat-equivalent.  Path reversal (reverse the sequence) is
  // also a symmetry — the same closed zigzag traversed backwards — so include
  // the even rotations of the reversed sequence too.
  const evenRots = a => [
    [a[0],a[1],a[2],a[3],a[4],a[5]],
    [a[2],a[3],a[4],a[5],a[0],a[1]],
    [a[4],a[5],a[0],a[1],a[2],a[3]],
  ];
  c3ValidList.forEach(([a, b, c, d], idx) => {
    const s   = [L3-c-d, a, d, b, c, L3-a-b];
    const rev = [s[5],s[4],s[3],s[2],s[1],s[0]];
    const cands = [...evenRots(s), ...evenRots(rev)];
    const key = cands.map(r => r.join(',')).sort().at(0);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ idx: idx + 1, a, b, c, d });
  });
  let found = 0;
  for (const [key, entries] of groups) {
    if (entries.length > 1) {
      found++;
      console.log(`seq=[${key}]: ` +
        entries.map(e => `#${e.idx}(a=${e.a},b=${e.b},c=${e.c},d=${e.d})`).join('  '));
    }
  }
  console.log(`${found} group(s) with rotationally equivalent segment sequence  (${c3ValidList.length} total)`);
};

// ── Tying sequence ─────────────────────────────────────────────────────────
function generateTyingSequence() {
  const B   = parseInt(document.getElementById('bInput').value);
  const mod = 2 * currentC * B;
  const bights = generateBights(B);
  const n = bights.length;

  // Row numbering: distinct y-values sorted ascending
  const yValues = [...new Set(bights.map(b => b[1]))].sort((a, b) => a - b);
  const yToRow  = new Map(yValues.map((y, i) => [y, i]));

  // Per-row bight labels (same as diagram: sort by x within row)
  const bightLabel = new Array(n);
  const byY = new Map();
  for (let j = 0; j < n; j++) {
    const y = bights[j][1];
    if (!byY.has(y)) byY.set(y, []);
    byY.get(y).push(j);
  }
  for (const group of byY.values()) {
    group.sort((a, b) => bights[a][0] - bights[b][0]);
    group.forEach((j, idx) => { bightLabel[j] = idx; });
  }

  // Cumulative arc-lengths
  const cumLen = [0];
  for (let i = 0; i < n; i++)
    cumLen.push(cumLen[i] + Math.abs(bights[(i+1)%n][1] - bights[i][1]));

  // Find all crossings
  const seen = new Map();
  for (let p = 0; p < n; p++) {
    const [ax, ay] = bights[p];
    const dxp = Math.abs(bights[(p+1)%n][1] - ay);
    if (bights[(p+1)%n][1] - ay <= 0) continue;
    for (let q = 0; q < n; q++) {
      const [cx, cy] = bights[q];
      const dxq = Math.abs(bights[(q+1)%n][1] - cy);
      if (bights[(q+1)%n][1] - cy >= 0) continue;
      const diffY = cy - ay;
      for (let t = 1; t < dxp; t++) {
        const u = diffY - t;
        if (u <= 0 || u >= dxq) continue;
        if ((ax + t) % mod !== (cx + u) % mod) continue;
        const key = `${(ax+t)%mod},${ay+t}`;
        if (!seen.has(key))
          seen.set(key, {p, q, tP: t, tQ: u, sP: cumLen[p]+t});
      }
    }
  }

  // Assign over/under by sP order
  const crossList = [...seen.values()].sort((a, b) => a.sP - b.sP);
  crossList.forEach((c, i) => { c.pIsOver = (i % 2 === 0); });
  const flip = needsParityFlip(crossList);
  if (flip) crossList.forEach(c => { c.pIsOver = !c.pIsOver; });

  // Per-segment crossing lists sorted by position along segment
  const segCrossings = Array.from({length: n}, () => []);
  for (const {p, q, tP, tQ, pIsOver} of crossList) {
    segCrossings[p].push({t: tP, other: q, isOver:  pIsOver});
    segCrossings[q].push({t: tQ, other: p, isOver: !pIsOver});
  }
  for (let i = 0; i < n; i++)
    segCrossings[i].sort((a, b) => a.t - b.t);

  // Build sequence
  const m = parseInt(document.getElementById('mInput').value);
  const lines = [
    `# Turk's Head Knot tying sequence`,
    `# ${m} leads × ${B} bights, complexity=${currentC}` +
      (currentC === 2 ? `  (a=${currentA}, b=${currentB})` : '') +
      (currentC === 3 ? `  (a=${c3A}, b=${c3B}, c=${c3C}, d=${c3D})` : ''),
    `# ${n} path bights, mod=${mod}, ${crossList.length} crossings`,
    ``
  ];

  for (let i = 0; i < n; i++) {
    const [, y] = bights[i];
    const prevY = bights[(i - 1 + n) % n][1];
    const nextY = bights[(i + 1) % n][1];
    const isTop = prevY < y && nextY < y;
    lines.push(`${isTop ? 'H' : 'L'}(${yToRow.get(y)},${bightLabel[i]})`);
    for (const {other, isOver} of segCrossings[i])
      if (other < i)
        lines.push(`  ${isOver ? 'O' : 'U'}`);
  }

  return lines.join('\n');
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const seq  = generateTyingSequence();
  const m    = parseInt(document.getElementById('mInput').value);
  const B    = parseInt(document.getElementById('bInput').value);
  const blob = new Blob([seq], {type: 'text/plain'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `knot_${m}L_${B}B.txt`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
});

// ── Round diagram PDF export ─────────────────────────────────────────────────
// Renders the round diagram (grid, coordinates, bights) to an offscreen canvas,
// but draws only the path portions whose enclosing crossing is "over" — or
// "under" when swap=true.  Consecutive crossings along the path are separated by
// a divider point: the bight between them if the path passes through one,
// otherwise the midpoint between the two crossings.
const PDF_SS = 2;   // supersampling: render at 2x, place in PDF at logical size
// US Letter page (pt) with 0.5" left/right margins; diagram fits the content width.
const PAGE_W = 612, PAGE_H = 792, SIDE_MARGIN = 36;
const CONTENT_W = PAGE_W - 2 * SIDE_MARGIN;          // 540 pt = 7.5"

function renderRoundExportPage(swap) {
  const B        = parseInt(document.getElementById('bInput').value);
  const mod      = 2 * currentC * B;
  const innerRaw = parseFloat(document.getElementById('roundInnerSlider').value);
  const outerRaw = parseFloat(document.getElementById('roundOuterSlider').value);

  // The canvas IS the page-content square (logical units = printed pt, drawn 1:1
  // so the image is placed without further scaling).  Only the DIAGRAM geometry
  // is scaled to fill the page — line widths, marker radii and text are then
  // fixed in pt and don't shrink/grow with the radius sliders.  margin leaves
  // room (pt) for the coordinate labels and the caption.
  const margin = 64;
  const W      = CONTENT_W;
  // The max-radius diagram fills the page; smaller radii scale down by the same
  // factor (a half-radius diagram prints at half size).  Line widths, markers
  // and text stay fixed in pt regardless of this scale.
  const outerMax = parseFloat(document.getElementById('roundOuterSlider').max);
  const scale  = (W / 2 - margin) / outerMax;
  const outerR = outerRaw * scale;
  const innerR = innerRaw * scale;
  const canvas = document.createElement('canvas');
  canvas.width = W * PDF_SS; canvas.height = W * PDF_SS;
  const ctx = canvas.getContext('2d');
  ctx.scale(PDF_SS, PDF_SS);                      // draw in logical (=pt) coordinates
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, W);

  const cx = W / 2, cy = W / 2;
  // Page 2 (swap) mirrors the GEOMETRY about the vertical centerline (the line
  // through rawX=0 at the top), so when printed on the back of the sheet the
  // points register with page 1 through the paper.  mx() flips an x coordinate;
  // labels keep their normal glyphs (only their position is mirrored) so they
  // stay readable on the reverse side.
  const mx = (x) => swap ? 2 * cx - x : x;
  const toC = (rawX, y) => {
    const theta = (rawX / mod) * 2 * Math.PI - Math.PI / 2;
    const r = innerR + (y / MAX_Y) * (outerR - innerR);
    return [mx(cx + r * Math.cos(theta)), cy + r * Math.sin(theta)];
  };

  // Grid: concentric circles + radial lines (dark-on-white print palette)
  const zigzagYs = new Set([0, ...ZIGZAG.map(p => p[1])]);
  ctx.strokeStyle = 'rgba(70,100,200,0.45)';
  ctx.lineWidth = 1;
  for (let y = 0; y <= MAX_Y; y++) {
    const r = innerR + (y / MAX_Y) * (outerR - innerR);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
  }
  for (let x = 0; x < mod; x++) {
    const [x1, y1] = toC(x, 0);
    const [x2, y2] = toC(x, MAX_Y);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#2c4a8a';
  for (let x = 0; x < mod; x++) {
    const theta = (x / mod) * 2 * Math.PI - Math.PI / 2;
    const ar = outerR + 16;
    ctx.fillText(String(x), mx(cx + ar * Math.cos(theta)), cy + ar * Math.sin(theta) + 4);
  }
  ctx.textAlign = 'left';
  for (let y = 0; y <= MAX_Y; y++) {
    ctx.fillStyle = zigzagYs.has(y) ? '#9a6a00' : '#566392';
    const [lx, ly] = toC(0, y);
    ctx.fillText(String(y), lx + 5, ly + 4);
  }

  const components   = generateAllComponents(B);
  const g            = components.length;
  const allCrossings = computeDiagramCrossingsAll(components, mod);
  const drawComponents = componentMode ? components.slice(0, 1) : components;

  let pathLenPx = 0;   // total drawn-path length in logical px (= PDF points)

  for (let comp = 0; comp < drawComponents.length; comp++) {
    const bights   = drawComponents[comp];
    const crossMap = allCrossings[comp];
    const n        = bights.length;
    const numSegs  = componentMode ? D : n;
    const numZigsR = Math.max(1, Math.floor(numSegs / D));

    // Per-segment geometry + cumulative path length (raw units).
    const segCum = [0];
    const segGeo = [];
    let rawX = bights[0][0];
    for (let i = 0; i < numSegs; i++) {
      const ay = bights[i][1], by = bights[(i + 1) % n][1];
      const dx = Math.abs(by - ay);
      segGeo.push({ rawX, ay, by, dx });
      segCum.push(segCum[i] + dx);
      rawX += dx;
    }
    const totalLen = segCum[numSegs];
    if (totalLen === 0) continue;

    // Accumulate the geometric (spiral) length of the full drawn path. The
    // mirror on page 2 is an isometry, so this is identical on both pages.
    for (const s of segGeo) {
      const sub = Math.max(8, Math.ceil(s.dx * 16));
      let [px, py] = toC(s.rawX, s.ay);
      for (let k = 1; k <= sub; k++) {
        const f = k / sub;
        const [qx, qy] = toC(s.rawX + f * s.dx, s.ay + f * (s.by - s.ay));
        pathLenPx += Math.hypot(qx - px, qy - py); px = qx; py = qy;
      }
    }

    // Ordered crossings along the path: global position p + isOver flag.
    const crs = [];
    for (let i = 0; i < numSegs; i++)
      for (const c of (crossMap.get(i) || []))
        crs.push({ p: segCum[i] + c.t, isOver: !c.isUnder });
    if (!crs.length) continue;
    crs.sort((a, b) => a.p - b.p);
    const nc = crs.length;

    const bightPos = []; for (let i = 0; i < numSegs; i++) bightPos.push(segCum[i]);

    const locate = (p) => {
      const pm = ((p % totalLen) + totalLen) % totalLen;
      let i = 0;
      while (i < numSegs - 1 && pm >= segCum[i + 1]) i++;
      return { i, pm };
    };
    const xyAt = (p) => {
      const { i, pm } = locate(p);
      const seg = segGeo[i];
      const f = seg.dx ? (pm - segCum[i]) / seg.dx : 0;
      return toC(seg.rawX + f * seg.dx, seg.ay + f * (seg.by - seg.ay));
    };

    // Divider between crossing j and j+1 (cyclic, unwrapped > crs[j].p):
    // the bight in the gap nearest the midpoint, else the midpoint.
    // Returns {pos, bight} so midpoint dividers can be marked with a circle.
    const divider = (j) => {
      const a = crs[j].p;
      let b = crs[(j + 1) % nc].p; if (j === nc - 1) b += totalLen;
      const mid = (a + b) / 2;
      let best = null, bestD = Infinity;
      for (const bp0 of bightPos)
        for (const bp of [bp0, bp0 + totalLen])
          if (bp > a + 1e-6 && bp < b - 1e-6) {
            const d = Math.abs(bp - mid);
            if (d < bestD) { bestD = d; best = bp; }
          }
      return best !== null ? { pos: best, bight: true } : { pos: mid, bight: false };
    };

    // Small open circle marking a midpoint divider (a "new point").
    const drawEndCircle = (p) => {
      const [px, py] = xyAt(p);
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.2; ctx.stroke();
    };

    // Stroke the path between unwrapped positions, inserting bight corners.
    const strokeRange = (pStart, pEnd, color, width) => {
      const breaks = [pStart, pEnd];
      const base = Math.floor(pStart / totalLen) * totalLen;
      for (let k = -1; k <= 2; k++)
        for (let i = 0; i <= numSegs; i++) {
          const bp = base + k * totalLen + segCum[i];
          if (bp > pStart + 1e-6 && bp < pEnd - 1e-6) breaks.push(bp);
        }
      breaks.sort((u, v) => u - v);
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      let started = false;
      for (let bi = 0; bi < breaks.length - 1; bi++) {
        const a = breaks[bi], b = breaks[bi + 1];
        const sub = Math.max(2, Math.ceil((b - a) * 8));
        for (let s = (bi === 0 ? 0 : 1); s <= sub; s++) {
          const [px, py] = xyAt(a + (b - a) * s / sub);
          if (!started) { ctx.moveTo(px, py); started = true; }
          else ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
    };

    const THICK = 4, THIN = 1;
    // Draw the arc around crossing j with the given line width.
    const drawArcFor = (j, width) => {
      const cp = crs[j].p;
      let dStart = divider((j - 1 + nc) % nc).pos;
      let dEnd   = divider(j).pos;
      while (dStart > cp) dStart -= totalLen;
      while (dEnd   < cp) dEnd   += totalLen;
      const zi  = Math.floor(locate(cp).i / D);
      const hue = `hsl(${(comp / g + zi / numZigsR / g) * 360},85%,45%)`;
      strokeRange(dStart, dEnd, hue, width);
    };

    // Opposite-side arcs first (thin), then this-side arcs (thick) on top so
    // the over/under relationship reads correctly at the crossings.
    for (let j = 0; j < nc; j++)
      if ((swap ? !crs[j].isOver : crs[j].isOver) === false) drawArcFor(j, THIN);
    for (let j = 0; j < nc; j++)
      if ((swap ? !crs[j].isOver : crs[j].isOver) === true)  drawArcFor(j, THICK);

    // Open circles at every non-bight divider (the added midpoints).
    for (let j = 0; j < nc; j++) {
      const d = divider(j);
      if (!d.bight) drawEndCircle(d.pos);
    }
  }

  // Bight dots and labels (same as drawRoundDiagram)
  for (let comp = 0; comp < (componentMode ? 1 : g); comp++) {
    const bights = components[comp];
    const n = bights.length;
    const numBights = componentMode ? D + 1 : n;
    const byY = new Map();
    for (let j = 0; j < n; j++) {
      const y = bights[j][1];
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(j);
    }
    const bightLabel = new Array(n);
    for (const group of byY.values()) {
      group.sort((a, b) => bights[a][0] - bights[b][0]);
      group.forEach((j, idx) => { bightLabel[j] = idx; });
    }
    ctx.textAlign = 'center';
    for (let j = 0; j < numBights; j++) {
      const [x, y] = bights[j];
      const [bsx, bsy] = toC(x, y);
      const prevY = bights[(j - 1 + n) % n][1];
      const nextY = bights[(j + 1) % n][1];
      const isTop = prevY < y && nextY < y;
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(bsx, bsy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.font = '11px monospace';
      ctx.fillStyle = '#7a5500';
      ctx.fillText(String(bightLabel[j]), bsx, isTop ? bsy + 19 : bsy - 13);
    }
  }

  // Center registration mark (coincides on both pages — it's on the mirror axis).
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy);
  ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI * 2); ctx.stroke();

  // String-length caption (identical on both pages; centered on the mirror axis
  // so it's not affected by the page-2 mirror and reads normally on both sides).
  // Logical units are printed pt now, so pathLenPx/outerR are already in pt;
  // ratio K is scale-independent, the inch figures assume printing at 100%.
  const K     = pathLenPx / (2 * outerR);              // string per outer diameter
  const odIn  = (2 * outerR) / 72;                     // outer ⌀ in inches at 100%
  const strIn = pathLenPx / 72;                        // string in inches at 100%
  ctx.fillStyle = '#111'; ctx.textAlign = 'center';
  ctx.font = 'bold 12px monospace';
  ctx.fillText(`String ≈ ${K.toFixed(1)} × (outer circle diameter)`,
               cx, W - 30);
  ctx.font = '11px monospace';
  ctx.fillText(`At 100% print: outer ⌀ = ${odIn.toFixed(1)} in  →  string ≈ ${strIn.toFixed(1)} in`,
               cx, W - 13);

  return canvas;
}

document.getElementById('pdfDownloadBtn').addEventListener('click', () => {
  if (!window.jspdf || !window.jspdf.jsPDF) { alert('PDF library failed to load.'); return; }
  const { jsPDF } = window.jspdf;
  const page1 = renderRoundExportPage(false);
  const page2 = renderRoundExportPage(true);
  // Scale the square diagram to the content width and center it on a Letter page,
  // with 0.5" left/right margins.  The diagram center lands on the page's
  // vertical centerline, so the two pages register for duplex printing.
  const dim = CONTENT_W;
  const x   = SIDE_MARGIN;
  const y   = (PAGE_H - dim) / 2;
  const m = parseInt(document.getElementById('mInput').value);
  const B = parseInt(document.getElementById('bInput').value);

  // Header line for the top of each page.
  const mod = 2 * currentC * B;
  const crossings = computeDiagramCrossingsAll(generateAllComponents(B), mod).crossingCount;
  const seq = currentC === 2 ? `${ab2ValidIdx + 1}/${ab2ValidList.length}`
            : currentC === 3 ? `${c3ValidIdx + 1}/${c3ValidList.length}`
            : '1/1';
  const header = `Complexity ${currentC}  |  Leads ${m}  |  Bights ${B}  |  `
               + `No. ${seq}  |  ${mod} bights  |  ${crossings} crossings`;

  const pdf = new jsPDF({ unit: 'pt', format: [PAGE_W, PAGE_H] });
  const addHeader = () => { pdf.setFontSize(10); pdf.text(header, PAGE_W / 2, 28, { align: 'center' }); };
  pdf.addImage(page1.toDataURL('image/png'), 'PNG', x, y, dim, dim);
  addHeader();
  pdf.addPage([PAGE_W, PAGE_H]);
  pdf.addImage(page2.toDataURL('image/png'), 'PNG', x, y, dim, dim);
  addHeader();
  pdf.save(`knot_${m}L_${B}B_round.pdf`);
});

// ── Initial state ──────────────────────────────────────────────────────────
syncAB2List(parseInt(document.getElementById('mInput').value));
setKnotFromUI(parseInt(document.getElementById('mInput').value));   // rebuild ZIGZAG for the synced a,b
syncRoundOuterMax();
document.getElementById('abParamDisplay').style.display = '';
enterKnotMode();

// ── Render loop ────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  if (showKnot || showStraight) orthoOrbit.update();
  renderer.render(scene, activeCamera);
})();

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  syncRoundOuterMax();
  if (showDiagram) { drawDiagram(); }
  if (showTubeDiag) buildTubeDiagram();
  if (showRoundDiag) drawRoundDiagram();
  if (showKnot) buildKnot();
  if (showStraight) buildStraight();
});
