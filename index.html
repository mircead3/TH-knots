<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ──────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060610);
scene.fog = new THREE.FogExp2(0x060610, 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

// ── Controls ───────────────────────────────────────────────────────────────
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.07;
orbit.minDistance = 3;
orbit.maxDistance = 50;

let autoRotate = true;
orbit.addEventListener('start', () => { autoRotate = false; });

// ── Lights ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x18183a, 4));

const keyLight = new THREE.DirectionalLight(0x8899ff, 4);
keyLight.position.set(6, 8, 6);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff7744, 2);
rimLight.position.set(-8, -4, -6);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x44ffcc, 1);
fillLight.position.set(0, -8, 5);
scene.add(fillLight);

// ── Zigzag knot definition ─────────────────────────────────────────────────
// For leads m, parameters a≥0 b≥0 a+b≤m-1:
//   rows at y = 0, 2a, m+a-b, m+a+b
//   zigzag bights: (0,0) → (m+a-b, m+a-b) → (2m-2b, 2a) → (3m-a-b, m+a+b)
//   period = 4m,  d = 4  (always),  leads = m
let ZIGZAG, PERIOD, D, LEADS, MAX_Y;

function setKnotDef(m, a, b) {
  ZIGZAG = [
    [0,           0          ],
    [m + a - b,   m + a - b  ],
    [2*m - 2*b,   2*a        ],
    [3*m - a - b, m + a + b  ],
  ];
  PERIOD = 4 * m;
  D      = 4;
  LEADS  = m;
  MAX_Y  = m + a + b;
}

function setKnotDefC1(m) {
  ZIGZAG = [[0, 0], [m, m]];
  PERIOD = 2 * m;
  D      = 2;
  LEADS  = m;
  MAX_Y  = m;
}

function setKnotDefC3(m, a, b, c, d) {
  const L = m;
  ZIGZAG = [
    [0,                  0              ],
    [3*L - c - d,        3*L - c - d    ],
    [3*L + a - c - d,    3*L - a - c - d],
    [3*L + a - c,        3*L - a - c    ],
    [3*L + a + b - c,    3*L - a - b - c],
    [3*L + a + b,        3*L - a - b    ],
  ];
  PERIOD = 6 * m;
  D      = 6;
  LEADS  = m;
  MAX_Y  = Math.max(3*L - c - d, 3*L - a - c, 3*L - a - b);
}

let currentC = 2;

function setKnotFromUI(m) {
  if (currentC === 1) setKnotDefC1(m);
  else if (currentC === 2) { const [a, b] = getAB(); setKnotDef(m, a, b); }
  else { setKnotDefC3(m, c3A, c3B, c3C, c3D); }
}

setKnotDef(5, 1, 1); // initial values match the original example

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

// Generate the full list of bight [x,y] coordinates for B bights (in path order).
// In degenerate cases (e.g. a=b=0) the path closes before all B periods are
// exhausted; we detect this by stopping at the first return to the start bight.
function generateBights(B) {
  const mod = 2 * currentC * B;
  const bights = [];
  const seen = new Set();
  for (let k = 0; k < B; k++) {
    for (const [x, y] of ZIGZAG) {
      const bx = (x + k * PERIOD) % mod;
      const key = `${bx},${y}`;
      if (seen.has(key)) return bights;
      seen.add(key);
      bights.push([bx, y]);
    }
  }
  return bights;
}

// Return true if the parity of crossing assignments should be flipped so that
// the first crossing encountered during tying (min segment index, then min t)
// is an over-crossing for the later strand.
// crossings must be sorted by sP with pIsOver = (i%2===0) already set.
function needsParityFlip(crossings) {
  let bestSeg = Infinity, bestT = Infinity, firstIsOver = true;
  for (const {p, q, tP, tQ, pIsOver} of crossings) {
    const laterSeg   = Math.max(p, q);
    const tOnLater   = p > q ? tP : tQ;
    const isOverLater = p > q ? pIsOver : !pIsOver;
    if (laterSeg < bestSeg || (laterSeg === bestSeg && tOnLater < bestT)) {
      bestSeg = laterSeg; bestT = tOnLater; firstIsOver = isOverLater;
    }
  }
  return !firstIsOver;
}

// Generate all g = gcd(LEADS, B) components of the TH link.
// Component j is component 0 with all bight x-coordinates shifted by j × gcd(PERIOD, mod) / g.
function generateAllComponents(B) {
  const mod  = 2 * currentC * B;
  const base = generateBights(B);
  const g    = gcd(LEADS, B);
  if (g === 1) return [base];
  const shift = gcd(PERIOD, mod) / g;
  const components = [base];
  for (let j = 1; j < g; j++) {
    const off = j * shift;
    components.push(base.map(([x, y]) => [(x + off) % mod, y]));
  }
  return components;
}

// Find all crossings between slope+1 and slope-1 segments, assign alternating
// over/under by sorting encounters along the strand, return as bump events.
function buildCrossingEvents(bights, mod, cumLen, totalLen) {
  const n = bights.length;
  const seen = new Map(); // key `cx,cy` → {sP, sQ, p, q, tP, tQ}

  for (let p = 0; p < n; p++) {
    const [ax, ay] = bights[p];
    const [px2, py2] = bights[(p + 1) % n];
    const dxp = Math.abs(py2 - ay);
    if (py2 - ay <= 0) continue; // slope+1 segments only

    for (let q = 0; q < n; q++) {
      const [cx, cy] = bights[q];
      const [qx2, qy2] = bights[(q + 1) % n];
      const dxq = Math.abs(qy2 - cy);
      if (qy2 - cy >= 0) continue; // slope-1 segments only

      const diffY = cy - ay;
      for (let t = 1; t < dxp; t++) {
        const u = diffY - t;
        if (u <= 0 || u >= dxq) continue;
        if ((ax + t) % mod !== (cx + u) % mod) continue;

        const key = `${(ax + t) % mod},${ay + t}`;
        if (!seen.has(key))
          seen.set(key, { sP: cumLen[p] + t, sQ: cumLen[q] + u, p, q, tP: t, tQ: u });
      }
    }
  }

  const crossings = [...seen.values()];
  crossings.sort((a, b) => a.sP - b.sP);
  crossings.forEach((c, i) => { c.pIsOver = (i % 2 === 0); });
  const flip = needsParityFlip(crossings);
  if (flip) crossings.forEach(c => { c.pIsOver = !c.pIsOver; });

  const events = [];
  for (const { sP, sQ, pIsOver } of crossings) {
    for (const offset of [0, -totalLen, totalLen]) {
      events.push({ s_c: sP + offset, isOver:  pIsOver });
      events.push({ s_c: sQ + offset, isOver: !pIsOver });
    }
  }
  return events;
}

// Per-segment crossing data with exact (x,y) coordinates and over/under assignments.
function buildSegmentCrossings(bights, mod, cumLen) {
  const n = bights.length;
  const seen = new Map();
  for (let p = 0; p < n; p++) {
    const [ax, ay] = bights[p];
    const dxp = Math.abs(bights[(p+1)%n][1] - ay);
    if (bights[(p+1)%n][1] - ay <= 0) continue;
    for (let q = 0; q < n; q++) {
      const [cx, cy] = bights[q];
      const dxq = Math.abs(bights[(q+1)%n][1] - cy);
      if (bights[(q+1)%n][1] - cy >= 0) continue;
      const diffY = cy - ay;
      for (let t = 1; t < dxp; t++) {
        const u = diffY - t;
        if (u <= 0 || u >= dxq) continue;
        if ((ax + t) % mod !== (cx + u) % mod) continue;
        const key = `${(ax+t)%mod},${ay+t}`;
        if (!seen.has(key))
          seen.set(key, { p, q, tP: t, tQ: u, sP: cumLen[p]+t, x: (ax+t)%mod, y: ay+t });
      }
    }
  }

  const crossings = [...seen.values()].sort((a, b) => a.sP - b.sP);
  crossings.forEach((c, i) => { c.pIsOver = (i % 2 === 0); });
  const flip = needsParityFlip(crossings);
  if (flip) crossings.forEach(c => { c.pIsOver = !c.pIsOver; });

  const segCrossings = Array.from({length: n}, () => []);
  for (const {p, q, tP, tQ, x, y, pIsOver} of crossings) {
    segCrossings[p].push({t: tP, x, y, isOver:  pIsOver});
    segCrossings[q].push({t: tQ, x, y, isOver: !pIsOver});
  }
  for (let i = 0; i < n; i++) segCrossings[i].sort((a, b) => a.t - b.t);
  return segCrossings;
}

// Find all crossings across all components (intra- and inter-component).
// Returns result[c][i] = [{t, x, y, isOver}] for segment i of component c.
function buildAllSegmentCrossings(components, mod) {
  const nC = components.length;
  const seen = new Map();
  for (let ci = 0; ci < nC; ci++) {
    const bP = components[ci], np = bP.length;
    for (let p = 0; p < np; p++) {
      const [ax, ay] = bP[p];
      const dxp = Math.abs(bP[(p+1)%np][1] - ay);
      if (bP[(p+1)%np][1] - ay <= 0) continue;
      for (let cj = 0; cj < nC; cj++) {
        const bQ = components[cj], nq = bQ.length;
        for (let q = 0; q < nq; q++) {
          const [cx, cy] = bQ[q];
          const dxq = Math.abs(bQ[(q+1)%nq][1] - cy);
          if (bQ[(q+1)%nq][1] - cy >= 0) continue;
          const diffY = cy - ay;
          for (let t = 1; t < dxp; t++) {
            const u = diffY - t;
            if (u <= 0 || u >= dxq) continue;
            if ((ax + t) % mod !== (cx + u) % mod) continue;
            const key = `${(ax+t)%mod},${ay+t}`;
            if (!seen.has(key))
              seen.set(key, {ci, p, tP:t, cj, q, tQ:u, x:(ax+t)%mod, y:ay+t});
          }
        }
      }
    }
  }

  const list = [...seen.values()];
  const yRank = new Map([...new Set(list.map(c => c.y))].sort((a,b) => a-b).map((y,i) => [y,i]));
  list.forEach(c => { c.pIsOver = (yRank.get(c.y) % 2 === 0); });
  const forFlip = list.map(c => ({p:c.p, q:c.q, tP:c.tP, tQ:c.tQ, pIsOver:c.pIsOver}));
  if (needsParityFlip(forFlip)) list.forEach(c => { c.pIsOver = !c.pIsOver; });

  const result = components.map(b => b.map(() => []));
  for (const {ci, p, tP, cj, q, tQ, x, y, pIsOver} of list) {
    result[ci][p].push({t:tP, x, y, isOver:  pIsOver});
    result[cj][q].push({t:tQ, x, y, isOver: !pIsOver});
  }
  for (let c = 0; c < nC; c++)
    for (let i = 0; i < components[c].length; i++)
      result[c][i].sort((a, b) => a.t - b.t);
  return result;
}

// Cubic Hermite spline through crossing points with analytically-derived tangents.
// At each crossing the tangent is the exact derivative of the 3D position mapping
// with respect to the abstract path parameter, using the segment's ±1 slope.
class KnotCurve extends THREE.Curve {
  constructor(bights, segCrossings, mod, viewT, closed = true, cpsByX = null, noBightPull = false) {
    super();
    const n      = bights.length;
    const tubeR  = parseFloat(document.getElementById('thickInput').value);
    const R      = 4.5, H = 8;
    const innerR = Math.min(1.0, Math.max(0.05, 0.1 * (mod / D)));
    const outerR = 5.5;
    const delta  = 0.18 * Math.max(0.3, 1.25 * tubeR / 0.25);

    const to3D = (x, y, radOff = 0) => {
      const theta = (x / mod) * 2 * Math.PI;
      const rFlat = innerR + (y / MAX_Y) * (outerR - innerR);
      const zCyl  = (y / MAX_Y) * H - H / 2;
      const r     = (1 - viewT) * rFlat + viewT * (R + radOff);
      const z     = (1 - viewT) * radOff  + viewT * zCyl;
      return new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), z);
    };

    // Analytical unit tangent: derivative of to3D w.r.t. abstract parameter,
    // using base radius (no radOff) since radOff is a fixed offset, not varying.
    const dir3D = (x, y, slope) => {
      const theta  = (x / mod) * 2 * Math.PI;
      const rFlat  = innerR + (y / MAX_Y) * (outerR - innerR);
      const r      = (1 - viewT) * rFlat + viewT * R;
      const dtheta = 2 * Math.PI / mod;                          // d(theta)/d(abstract_x)
      const dr     = (1 - viewT) * slope * (outerR - innerR) / MAX_Y;
      const dz     = viewT * slope * H / MAX_Y;
      return new THREE.Vector3(
        dr * Math.cos(theta) - r * Math.sin(theta) * dtheta,
        dr * Math.sin(theta) + r * Math.cos(theta) * dtheta,
        dz
      ).normalize();
    };

    // Tangent at a bight: average of the arriving (+1) and departing (-1) analytical
    // directions. At viewT=1 this collapses to the pure-theta (horizontal) direction,
    // which is the smooth tangent of the strand at its z-extremum on the cylinder.
    const bightDir3D = (x, y) => {
      const d1 = dir3D(x, y, +1);
      const d2 = dir3D(x, y, -1);
      return new THREE.Vector3(d1.x + d2.x, d1.y + d2.y, d1.z + d2.z).normalize();
    };

    // Crossings and bights are both control points. Each bight is shifted
    // inward from its extreme position (^ bights down, V bights up) so the
    // Hermite's natural overshoot lands at the intended visual boundary.
    // The base shift is 0.6; an adaptive correction accounts for how far the
    // nearest same-x control point is (e1) and whether it is a same-kind bight (e2).
    const K_DELTA = 0.25;

    // If no global map was supplied, build one from this component's own data.
    if (!cpsByX) {
      cpsByX = new Map();
      const addCP = (x, y, isBight, isTop) => {
        let arr = cpsByX.get(x);
        if (!arr) { arr = []; cpsByX.set(x, arr); }
        if (!arr.some(cp => cp.y === y)) arr.push({y, isBight, isTop});
      };
      const nSeg0 = closed ? n : n - 1;
      for (let i = 0; i < nSeg0; i++) {
        const s0 = Math.sign(bights[(i+1)%n][1] - bights[i][1]);
        const s1 = Math.sign(bights[(i+2)%n][1] - bights[(i+1)%n][1]);
        if (s0 !== s1) addCP(bights[(i+1)%n][0], bights[(i+1)%n][1], true, s0 > 0);
      }
      for (let i = 0; i < nSeg0; i++) {
        const [ax, ay] = bights[i];
        const [, by2] = bights[(i+1)%n];
        const slope = Math.sign(by2 - ay);
        const len = Math.abs(by2 - ay);
        for (let t = 0; t <= len; t++)
          addCP((ax + t) % mod, ay + slope * t, false, null);
      }
    }

    const bightDelta = (bx, by, isTop) => {
      if (noBightPull) return 0;
      const cps = cpsByX.get(bx) || [];
      let nearestD = Infinity, sameKind = false;
      for (const cp of cps) {
        if (cp.y === by) continue;
        if (isTop ? cp.y >= by : cp.y <= by) continue;
        const d = Math.abs(cp.y - by);
        if (d < nearestD) { nearestD = d; sameKind = cp.isBight && cp.isTop === isTop; }
      }
      if (nearestD === Infinity) return 0.6;
      return 0.6 + K_DELTA * (nearestD - 2) + (sameKind ? K_DELTA * 1.5 : 0);
    };

    this.pts      = [];
    this.dirs     = [];
    this.scales   = [];
    this.bightPts = [];

    const nSeg = closed ? n : n - 1;
    for (let i = 0; i < nSeg; i++) {
      const slope     = Math.sign(bights[(i+1)%n][1] - bights[i][1]);
      const nextSlope = Math.sign(bights[(i+2)%n][1] - bights[(i+1)%n][1]);
      const atBight   = slope !== nextSlope;
      const isLastSeg = !closed && i === nSeg - 1;

      for (const {x, y, isOver} of segCrossings[i]) {
        this.pts.push(to3D(x, y, isOver ? delta : -delta));
        this.dirs.push(dir3D(x, y, slope));
        this.scales.push(1);
      }

      if (atBight && !isLastSeg) {
        const [bx, by] = bights[(i+1)%n];
        const bd = bightDelta(bx, by, slope > 0);
        const by_adj = by - slope * bd;
        const bp = to3D(bx, by_adj, 0);
        this.pts.push(bp);
        this.dirs.push(bightDir3D(bx, by_adj));
        this.scales.push(1);
        this.bightPts.push(bp);
      }
    }
    if (!closed) {
      const [bx, by] = bights[n - 1];
      const slope = Math.sign(by - bights[n - 2][1]);
      this.pts.push(to3D(bx, by, 0));
      this.dirs.push(dir3D(bx, by, slope));
      this.scales.push(1);
    }
    this.m = this.pts.length;
    this.closed = closed;
  }

  getPoint(t, out = new THREE.Vector3()) {
    const { pts, dirs, m, closed } = this;
    const ft = closed ? ((t * m) % m + m) % m : t * (m - 1);
    const i  = Math.floor(Math.min(ft, m - 1));
    const u  = ft - i;
    const j  = closed ? (i + 1) % m : Math.min(i + 1, m - 1);

    const P0 = pts[i], P1 = pts[j];
    const scale = P0.distanceTo(P1) * this.scales[i];

    const h00 =  2*u*u*u - 3*u*u + 1;
    const h10 =    u*u*u - 2*u*u + u;
    const h01 = -2*u*u*u + 3*u*u;
    const h11 =    u*u*u -   u*u;

    return out.set(
      h00*P0.x + h10*scale*dirs[i].x + h01*P1.x + h11*scale*dirs[j].x,
      h00*P0.y + h10*scale*dirs[i].y + h01*P1.y + h11*scale*dirs[j].y,
      h00*P0.z + h10*scale*dirs[i].z + h01*P1.z + h11*scale*dirs[j].z
    );
  }
}

// ── Scene objects ──────────────────────────────────────────────────────────
const knotGroup = new THREE.Group();
scene.add(knotGroup);

function buildKnot(B, resumeRotation = false) {
  while (knotGroup.children.length) {
    const c = knotGroup.children[0];
    c.geometry.dispose();
    c.material.dispose();
    knotGroup.remove(c);
  }

  const mod        = 2 * currentC * B;
  const tubeRadius = parseFloat(document.getElementById('thickInput').value);

  const components     = generateAllComponents(B);
  const g              = components.length;
  const allSegCrossings = buildAllSegmentCrossings(components, mod);

  const interesting = allSegCrossings.every(c => c.every(s => s.length > 0));
  document.getElementById('interestingWarn').style.display = interesting ? 'none' : '';

  const slider = document.getElementById('viewSlider');
  const sliderRow = document.getElementById('viewSliderRow');
  const crossingYs = new Set(allSegCrossings.flat().flatMap(seg => seg.map(c => c.y)));
  const flatDegenerate = g > 1 && crossingYs.size <= 1;
  if (flatDegenerate) { slider.value = '1'; slider.disabled = true; sliderRow.style.opacity = '0.3'; }
  else                { slider.disabled = false; sliderRow.style.opacity = ''; }
  const vt = flatDegenerate ? 1.0 : parseFloat(slider.value);

  // Build a global same-x control-point map from all components so that
  // crossings from other components are visible to each component's bight-delta.
  const globalCpsByX = new Map();
  const addGCP = (x, y, isBight, isTop) => {
    let arr = globalCpsByX.get(x);
    if (!arr) { arr = []; globalCpsByX.set(x, arr); }
    if (!arr.some(cp => cp.y === y)) arr.push({y, isBight, isTop});
  };
  for (let c2 = 0; c2 < g; c2++) {
    const cb = components[c2], nb = cb.length;
    for (let i = 0; i < nb; i++) {
      const s0 = Math.sign(cb[(i+1)%nb][1] - cb[i][1]);
      const s1 = Math.sign(cb[(i+2)%nb][1] - cb[(i+1)%nb][1]);
      if (s0 !== s1) addGCP(cb[(i+1)%nb][0], cb[(i+1)%nb][1], true, s0 > 0);
    }
  }
  for (let c2 = 0; c2 < g; c2++) {
    const cb = components[c2], nb = cb.length;
    for (let i = 0; i < nb; i++) {
      const [ax, ay] = cb[i];
      const [, by2] = cb[(i+1)%nb];
      const slope = Math.sign(by2 - ay);
      const len = Math.abs(by2 - ay);
      for (let t = 0; t <= len; t++)
        addGCP((ax + t) % mod, ay + slope * t, false, null);
    }
  }

  const radialSegments = 60;
  const tmp = new THREE.Color();

  const gDraw = componentMode ? 1 : g;
  for (let c = 0; c < gDraw; c++) {
    const fullBights = components[c];
    const useOpen = componentMode && fullBights.length > D;
    const bights = useOpen ? fullBights.slice(0, D + 1) : fullBights;
    const segCrossings = useOpen ? allSegCrossings[c].slice(0, D) : allSegCrossings[c];
    const isClosed = !useOpen;
    const curve  = new KnotCurve(bights, segCrossings, mod, vt, isClosed, globalCpsByX);
    const tubularSegments = Math.max(bights.length * 60, curve.m * 6);
    const geo = new THREE.TubeGeometry(curve, tubularSegments, tubeRadius, radialSegments, isClosed);

    // Knots (g=1): full rainbow gradient. Links (g>1): flat distinct hue per component.
    const ringCount    = tubularSegments + 1;
    const vertsPerRing = radialSegments + 1;
    const cols         = new Float32Array(ringCount * vertsPerRing * 3);
    for (let i = 0; i < ringCount; i++) {
      tmp.setHSL(g === 1 ? i / tubularSegments : c / g, 0.9, 0.62);
      for (let j = 0; j < vertsPerRing; j++) {
        const idx = (i * vertsPerRing + j) * 3;
        cols[idx] = tmp.r; cols[idx+1] = tmp.g; cols[idx+2] = tmp.b;
      }
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    knotGroup.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, specular: new THREE.Color(0xffffff), shininess: 140,
    })));
  }


  knotGroup.rotation.set(-0.4 * vt, 0, 0);
  if (resumeRotation) {
    camera.position.set(0, 4 * vt, 14);
    orbit.target.set(0, 0, 0);
    orbit.update();
    autoRotate = true;
  }

  updateInfo(B, g);
  if (currentC === 3) {
    syncC3List(LEADS, B);
  }
}

// ── Info panel ─────────────────────────────────────────────────────────────
const infoName      = document.getElementById('infoName');
const zigzagDisplay  = document.getElementById('zigzagDisplay');

function updateInfo(B, g = 1) {
  const mod = 2 * currentC * B;
  const parts = [`${2 * currentC * B} bights`];
  if (g > 1) parts.splice(1, 0, `${g} components`);
  infoName.textContent = parts.join('  ·  ');
  zigzagDisplay.textContent = `mod = ${mod}    ` +
    ZIGZAG.map(([x,y]) => `(${x},${y})`).join(' → ');
  positionZigzagDisplay();
}

// ── UI wiring ──────────────────────────────────────────────────────────────
let currentA = 1, currentB = 1;
let c3A = 2, c3B = 2, c3C = 2, c3D = 2;
let c3ValidList = [], c3ValidIdx = -1;
let c3ListCacheM = -1, c3ListCacheB = -1;
let componentMode = false;

function validC3(m, a, b, c, d) {
  if (a < 2 || b < 2 || c < 2 || d < 2) return false;
  if (a % 3 === 0 || b % 3 === 0 || c % 3 === 0 || d % 3 === 0) return false;
  if ((a + b) % 3 === 0 || (c + d) % 3 === 0) return false;
  if (a + b + c > 3 * m) return false;
  if (a + c + d > 3 * m) return false;
  if (c + d > a + b) return false;
  return true;
}


function computeValidC3(m, B) {
  const savedZZ = ZIGZAG, savedP = PERIOD, savedD = D, savedL = LEADS, savedMY = MAX_Y;
  const L3 = 3 * m, mod = 6 * B;
  const list = [];
  for (let a = 2; a <= L3 - 4; a++) {
    if (a % 3 === 0) continue;
    for (let b = 2; b <= L3 - a - 2; b++) {
      if (b % 3 === 0) continue;
      if ((a + b) % 3 === 0) continue;
      for (let c = 2; c <= Math.min(L3 - a - b, a + b - 2); c++) {
        if (c % 3 === 0) continue;
        const dMax = Math.min(L3 - a - c, a + b - c);
        for (let d = 2; d <= dMax; d++) {
          if (d % 3 === 0) continue;
          if ((c + d) % 3 === 0) continue;
          setKnotDefC3(m, a, b, c, d);
          const comps = generateAllComponents(B);
          const allSC = buildAllSegmentCrossings(comps, mod);
          if (allSC.every(comp => comp.every(seg => seg.length > 0))) list.push([a, b, c, d]);
        }
      }
    }
  }
  ZIGZAG = savedZZ; PERIOD = savedP; D = savedD; LEADS = savedL; MAX_Y = savedMY;
  return list;
}

function syncC3List(m, B) {
  if (m !== c3ListCacheM || B !== c3ListCacheB) {
    c3ValidList = computeValidC3(m, B);
    c3ListCacheM = m; c3ListCacheB = B;
    c3ValidIdx = 0;
    if (c3ValidList.length > 0) [c3A, c3B, c3C, c3D] = c3ValidList[0];
  } else {
    c3ValidIdx = c3ValidList.findIndex(([a,b,c,d]) => a===c3A && b===c3B && c===c3C && d===c3D);
    if (c3ValidIdx < 0 && c3ValidList.length > 0) {
      c3ValidIdx = 0;
      [c3A, c3B, c3C, c3D] = c3ValidList[0];
    }
  }
  updateC3Display();
  return c3ValidList.length > 0;
}

function updateC3Display() {
  const cnt = c3ValidList.length;
  document.getElementById('c3IdxDisplay').textContent =
    c3ValidIdx >= 0 ? `${c3ValidIdx + 1} / ${cnt}` : `— / ${cnt}`;
  const pd = document.getElementById('c3ParamDisplay');
  pd.style.display = currentC === 3 ? '' : 'none';
  pd.textContent = `a=${c3A}  b=${c3B}  c=${c3C}  d=${c3D}`;
}

function validPairs(m) {
  const pairs = [];
  for (let a = 0; a <= m - 3; a++)
    for (let b = 0; a + b <= m - 3; b++)
      if ((m - a - b) % 2 === 1) pairs.push([a, b]);
  return pairs;
}

function nearestValid(m, prefA, prefB) {
  const pairs = validPairs(m);
  let best = pairs[0], bestD = Infinity;
  for (const [a, b] of pairs) {
    const d = Math.abs(a - prefA) + Math.abs(b - prefB);
    if (d < bestD) { bestD = d; best = [a, b]; }
  }
  return best;
}

function buildABGrid(m) {
  const popup = document.getElementById('abPopup');
  popup.innerHTML = '';
  const maxAB = m - 3;
  const wrapper  = document.createElement('div');
  wrapper.className = 'ab-wrapper';
  const labelCol = document.createElement('div');
  labelCol.className = 'ab-label-col';
  const grid = document.createElement('div');
  grid.className = 'ab-grid';

  const allBs = new Set();
  for (let a = 0; a <= maxAB; a++)
    for (let b = 0; a + b <= maxAB; b++)
      if ((m - a - b) % 2 === 1) allBs.add(b);

  for (let a = 0; a <= maxAB; a++) {
    const validBs = [];
    for (let b = 0; a + b <= maxAB; b++)
      if ((m - a - b) % 2 === 1) validBs.push(b);
    if (validBs.length === 0) continue;

    const label = document.createElement('div');
    label.textContent = a;
    labelCol.appendChild(label);

    const row = document.createElement('div');
    row.className = 'ab-grid-row';
    const cells = document.createElement('div');
    cells.style.cssText = `display:flex; margin-left:${validBs[0] * 10}px`;
    for (const b of validBs) {
      const cell = document.createElement('div');
      cell.className = 'ab-cell ab-valid' + (a === currentA && b === currentB ? ' ab-selected' : '');
      cell.addEventListener('click', e => {
        e.stopPropagation();
        currentA = a; currentB = b;
        document.getElementById('abDisplay').textContent = `a=${a},  b=${b}`;
        popup.querySelectorAll('.ab-selected').forEach(el => el.classList.remove('ab-selected'));
        cell.classList.add('ab-selected');
        rebuildKnot();
      });
      cells.appendChild(cell);
    }
    row.appendChild(cells);
    grid.appendChild(row);
  }

  const bHeader = document.createElement('div');
  bHeader.className = 'ab-b-header';
  for (const b of [...allBs].sort((x,y) => x-y)) {
    const lbl = document.createElement('div');
    lbl.className = 'ab-b-label';
    lbl.textContent = b;
    lbl.style.left = `${b * 10}px`;
    bHeader.appendChild(lbl);
  }

  const spacer = document.createElement('div');
  spacer.style.height = '14px';
  labelCol.insertBefore(spacer, labelCol.firstChild);

  const rightCol = document.createElement('div');
  rightCol.appendChild(bHeader);
  rightCol.appendChild(grid);
  wrapper.appendChild(labelCol);
  wrapper.appendChild(rightCol);
  popup.appendChild(wrapper);
}

function getAB() { return [currentA, currentB]; }

function updateABSelector(m) {
  const only = currentC === 2 && validPairs(m).length <= 1;
  const el = document.getElementById('abDisplay');
  el.style.opacity = only ? '0.35' : '';
  el.style.pointerEvents = only ? 'none' : '';
}

function minLeads()  { return currentC === 2 ? 3 : 2; }
function minBights() { return currentC === 1 ? 2 : 1; }

function rebuildKnot() {
  const m = parseInt(document.getElementById('mInput').value);
  const B = parseInt(document.getElementById('bInput').value);
  if (isNaN(m) || isNaN(B) || m < minLeads() || B < minBights()) return;
  if (currentC === 2 && validPairs(m).length === 0) return;
  if (currentC === 3 && !validC3(m, c3A, c3B, c3C, c3D)) return;
  setKnotFromUI(m);
  buildKnot(B);
  if (showDiagram) drawDiagram();
}

function onMChange() {
  let m = parseInt(document.getElementById('mInput').value);
  if (isNaN(m)) return;
  if (m < minLeads()) {
    m = minLeads();
    document.getElementById('mInput').value = m;
  }
  if (currentC === 2) {
    const pairs = validPairs(m);
    if (pairs.length === 0) return;
    [currentA, currentB] = nearestValid(m, currentA, currentB);
    document.getElementById('abDisplay').textContent = `a=${currentA},  b=${currentB}`;
    if (document.getElementById('abPopup').style.display !== 'none') buildABGrid(m);
  }
  if (currentC === 3) {
    const B2 = parseInt(document.getElementById('bInput').value);
    if (!syncC3List(m, B2)) return;
  }
  updateABSelector(m);
  setKnotFromUI(m);
  buildKnot(parseInt(document.getElementById('bInput').value), true);
  if (showDiagram) drawDiagram();
}

document.getElementById('abDisplay').addEventListener('click', e => {
  e.stopPropagation();
  const m = parseInt(document.getElementById('mInput').value);
  const popup = document.getElementById('abPopup');
  if (popup.style.display === 'none') { buildABGrid(m); popup.style.display = 'block'; autoRotate = false; }
  else popup.style.display = 'none';
});

document.addEventListener('click', e => {
  if (!document.getElementById('abDisplay').contains(e.target) &&
      !document.getElementById('abPopup').contains(e.target))
    document.getElementById('abPopup').style.display = 'none';
});

document.addEventListener('keydown', e => {
  const popup = document.getElementById('abPopup');
  if (popup.style.display === 'none') return;
  if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const m = parseInt(document.getElementById('mInput').value);
  const maxAB = m - 3;
  let na = currentA, nb = currentB;

  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    // Move within same row (fixed a), searching for next valid b
    const db = e.key === 'ArrowRight' ? 1 : -1;
    for (let b = currentB + db; b >= 0 && b <= maxAB - currentA; b += db)
      if ((m - currentA - b) % 2 === 1) { nb = b; break; }
    if (nb === currentB) return; // no valid b found
  } else {
    // Move to adjacent row (change a), pick b closest to current
    const da = e.key === 'ArrowDown' ? 1 : -1;
    let found = false;
    for (let a = currentA + da; a >= 0 && a <= maxAB; a += da) {
      const bs = [];
      for (let b = 0; b + a <= maxAB; b++)
        if ((m - a - b) % 2 === 1) bs.push(b);
      if (bs.length) {
        na = a;
        nb = bs.reduce((p, c) => Math.abs(c - currentB) < Math.abs(p - currentB) ? c : p);
        found = true; break;
      }
    }
    if (!found) return;
  }

  currentA = na; currentB = nb;
  document.getElementById('abDisplay').textContent = `a=${na},  b=${nb}`;
  buildABGrid(m);
  rebuildKnot();
});

document.getElementById('mInput').addEventListener('change', onMChange);
document.getElementById('bInput').addEventListener('change', () => {
  const m = parseInt(document.getElementById('mInput').value);
  const B = parseInt(document.getElementById('bInput').value);
  if (isNaN(m) || isNaN(B) || m < minLeads() || B < minBights()) return;
  if (currentC === 3 && !syncC3List(m, B)) return;
  setKnotFromUI(m);
  buildKnot(B, true);
  if (showDiagram) drawDiagram();
});

function setComplexity(c) {
  currentC = c;
  document.getElementById('shapeSection').style.display  = c === 2 ? '' : 'none';
  document.getElementById('c3Section').style.display     = c === 3 ? '' : 'none';
  document.getElementById('c3ParamDisplay').style.display = c === 3 ? '' : 'none';
  const mInput = document.getElementById('mInput');
  mInput.min = minLeads();
  if (parseInt(mInput.value) < minLeads()) mInput.value = minLeads();
  const bInput = document.getElementById('bInput');
  bInput.min = minBights();
  if (parseInt(bInput.value) < minBights()) bInput.value = minBights();
  if (c === 2) {
    const m = parseInt(mInput.value);
    currentA = 0;
    currentB = m % 2 === 0 ? 1 : 0;
    document.getElementById('abDisplay').textContent = `a=${currentA},  b=${currentB}`;
  }
  if (c === 3) {
    c3ListCacheM = -1;
  }
  updateABSelector(parseInt(mInput.value));
  rebuildKnot();
}
document.getElementById('cInput').addEventListener('change', () => {
  const c = parseInt(document.getElementById('cInput').value);
  if (!isNaN(c) && c >= 1) setComplexity(c);
});
document.addEventListener('keydown', e => {
  if (currentC !== 3 || c3ValidList.length === 0) return;
  if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  e.preventDefault();
  const dir = (e.key === 'ArrowUp' || e.key === 'ArrowRight') ? 1 : -1;
  if (c3ValidIdx < 0) c3ValidIdx = dir === 1 ? 0 : c3ValidList.length - 1;
  else c3ValidIdx = (c3ValidIdx + dir + c3ValidList.length) % c3ValidList.length;
  [c3A, c3B, c3C, c3D] = c3ValidList[c3ValidIdx];
  updateC3Display();
  rebuildKnot();
});
document.getElementById('thickInput').addEventListener('input', () => {
  const B = parseInt(document.getElementById('bInput').value);
  buildKnot(B);
});

// ── Diagram view ───────────────────────────────────────────────────────────
// For each bight segment, returns a Map: segIndex → [{t (integer diagram units), isUnder}]
function computeDiagramCrossings(bights, n, mod) {
  const seen = new Map();
  const cumLen = [0];
  for (let i = 0; i < n; i++)
    cumLen.push(cumLen[i] + Math.abs(bights[(i+1)%n][1] - bights[i][1]));

  for (let p = 0; p < n; p++) {
    const [ax, ay] = bights[p];
    const dxp = Math.abs(bights[(p+1)%n][1] - ay);
    if (bights[(p+1)%n][1] - ay <= 0) continue;
    for (let q = 0; q < n; q++) {
      const [cx, cy] = bights[q];
      const dxq = Math.abs(bights[(q+1)%n][1] - cy);
      if (bights[(q+1)%n][1] - cy >= 0) continue;
      const diffY = cy - ay;
      for (let t = 1; t < dxp; t++) {
        const u = diffY - t;
        if (u <= 0 || u >= dxq) continue;
        if ((ax + t) % mod !== (cx + u) % mod) continue;
        const key = `${(ax+t)%mod},${ay+t}`;
        if (!seen.has(key))
          seen.set(key, {p, t, q, u, sP: cumLen[p]+t});
      }
    }
  }

  const list = [...seen.values()].sort((a, b) => a.sP - b.sP);
  list.forEach((c, i) => { c.pIsOver = (i % 2 === 0); });
  const flip = needsParityFlip(list.map(c => ({p:c.p, q:c.q, tP:c.t, tQ:c.u, pIsOver:c.pIsOver})));
  if (flip) list.forEach(c => { c.pIsOver = !c.pIsOver; });

  const perSeg = new Map();
  list.forEach(({p, t, q, u, pIsOver}) => {
    if (!perSeg.has(p)) perSeg.set(p, []);
    if (!perSeg.has(q)) perSeg.set(q, []);
    perSeg.get(p).push({t,    isUnder: !pIsOver});
    perSeg.get(q).push({t: u, isUnder:  pIsOver});
  });
  perSeg.crossingCount = list.length;
  return perSeg;
}

// Multi-component version: result[c] is a Map segIndex → [{t, isUnder}]
function computeDiagramCrossingsAll(components, mod) {
  const nC = components.length;
  const seen = new Map();
  for (let ci = 0; ci < nC; ci++) {
    const bP = components[ci], np = bP.length;
    for (let p = 0; p < np; p++) {
      const [ax, ay] = bP[p];
      if (bP[(p+1)%np][1] - ay <= 0) continue;
      const dxp = bP[(p+1)%np][1] - ay;
      for (let cj = 0; cj < nC; cj++) {
        const bQ = components[cj], nq = bQ.length;
        for (let q = 0; q < nq; q++) {
          const [cx, cy] = bQ[q];
          if (bQ[(q+1)%nq][1] - cy >= 0) continue;
          const dxq = cy - bQ[(q+1)%nq][1];
          const diffY = cy - ay;
          for (let t = 1; t < dxp; t++) {
            const u = diffY - t;
            if (u <= 0 || u >= dxq) continue;
            if ((ax + t) % mod !== (cx + u) % mod) continue;
            const key = `${(ax+t)%mod},${ay+t}`;
            if (!seen.has(key))
              seen.set(key, {ci, p, t, cj, q, u, x:(ax+t)%mod, y:ay+t});
          }
        }
      }
    }
  }
  const list = [...seen.values()];
  const yRank = new Map([...new Set(list.map(cr => cr.y))].sort((a,b) => a-b).map((y,i) => [y,i]));
  list.forEach(cr => { cr.pIsOver = (yRank.get(cr.y) % 2 === 0); });
  const forFlip = list.map(cr => ({p:cr.p, q:cr.q, tP:cr.t, tQ:cr.u, pIsOver:cr.pIsOver}));
  if (needsParityFlip(forFlip)) list.forEach(cr => { cr.pIsOver = !cr.pIsOver; });
  const result = components.map(() => new Map());
  list.forEach(({ci, p, t, cj, q, u, pIsOver}) => {
    if (!result[ci].has(p)) result[ci].set(p, []);
    if (!result[cj].has(q)) result[cj].set(q, []);
    result[ci].get(p).push({t,    isUnder: !pIsOver});
    result[cj].get(q).push({t: u, isUnder:  pIsOver});
  });
  result.crossingCount = list.length;
  return result;
}

let showDiagram = false;
const diagramCanvas = document.getElementById('diagram');

function drawDiagram() {
  const B   = parseInt(document.getElementById('bInput').value);
  const mod = 2 * currentC * B;

  diagramCanvas.width  = innerWidth;
  diagramCanvas.height = innerHeight;
  const ctx = diagramCanvas.getContext('2d');

  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  // Scale depends only on leads (LEADS = m): more leads → smaller unit.
  // ox is fixed just right of the panel; right edge is fixed at screen right.
  const PANEL_W  = 235;
  const LABEL_W  = 40;
  const padR     = 30;
  const diagH    = innerHeight * 0.75;
  const scale    = diagH / Math.max(MAX_Y, 2 * LEADS);
  const xStretch = parseFloat(document.getElementById('xStretchSlider').value);
  const scaleX   = scale * xStretch;
  const ox       = PANEL_W + LABEL_W;
  const availDiagW = innerWidth - ox - padR;
  const REPS     = Math.max(1, Math.ceil(availDiagW / (mod * scaleX)));
  const rStart   = componentMode ? 0 : -Math.ceil(PERIOD / mod);
  const drawReps = componentMode ? 1 : REPS;
  const totalW   = mod * REPS;
  const oy       = (innerHeight + MAX_Y * scale) / 2;

  const diagOffset = scaleX * 0.5; // shift so seam lines don't land on integer coords
  const px = x => ox + diagOffset + x * scaleX;
  const py = y => oy - y * scale;

  // Clip everything to the fixed diagram rectangle.
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, py(MAX_Y), availDiagW, MAX_Y * scale);
  ctx.clip();

  // All grid lines the same dim colour, stepping by 2 (all bight feet are even).
  ctx.strokeStyle = 'rgba(100,130,255,0.55)';
  ctx.lineWidth = 1;
  const kStart = Math.ceil(-MAX_Y / 2) * 2;
  for (let k = kStart; k <= totalW; k += 2) {
    ctx.beginPath();
    ctx.moveTo(px(k),         py(0));
    ctx.lineTo(px(k + MAX_Y), py(MAX_Y));
    ctx.stroke();
  }
  for (let k = 0; k <= totalW + MAX_Y; k += 2) {
    ctx.beginPath();
    ctx.moveTo(px(k),         py(0));
    ctx.lineTo(px(k - MAX_Y), py(MAX_Y));
    ctx.stroke();
  }

  ctx.restore();

  // Bight-row guide lines spanning all repetitions
  const rows = [...new Set([0, ...ZIGZAG.map(p => p[1])])].sort((a, b) => a - b);
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 1;
  for (const y of rows) {
    ctx.strokeStyle = 'rgba(100,130,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(px(0), py(y));
    ctx.lineTo(px(totalW), py(y));
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,205,255,0.75)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`y=${y}`, ox - 6, py(y) + 4);
  }
  ctx.setLineDash([]);

  // Cylinder-seam markers — extend 25px above and below the diagram.
  ctx.strokeStyle = 'rgba(160,185,255,0.75)';
  ctx.lineWidth = 1.5;
  for (let r = 0; r <= REPS; r++) {
    const sx = px(r * mod);
    ctx.beginPath();
    ctx.moveTo(sx, py(0)     + 25);
    ctx.lineTo(sx, py(MAX_Y) - 25);
    ctx.stroke();
  }

  const components   = generateAllComponents(B);
  const g            = components.length;
  const allCrossings = computeDiagramCrossingsAll(components, mod);

  // Precompute geometry for all components.
  // allSegs[comp][r][i][s] = {x1s, y1s, x2s, y2s, hue, gapF, underFs, overFs}
  const drawComponents = componentMode ? components.slice(0, 1) : components;
  const allSegs = drawComponents.map((bights, comp) => {
    const crossMap = allCrossings[comp];
    const n        = bights.length;
    const numZigs  = componentMode ? 1 : Math.floor(n / D);
    const segs = [];
    for (let r = rStart; r < drawReps; r++) {
      const xOff = r * mod;
      const rSegs = [];
      for (let i = 0; i < numZigs; i++) {
        const hue = `hsl(${(comp / g + i / numZigs / g) * 360},90%,65%)`;
        let cumX = bights[i * D][0];
        const iSegs = [];
        for (let s = 0; s < D; s++) {
          const idx = i * D + s;
          const nxt = (idx + 1) % n;
          const [, ay] = bights[idx];
          const [, by] = bights[nxt];
          const dx = Math.abs(by - ay);
          const x1s = px(cumX + xOff), y1s = py(ay);
          const x2s = px(cumX + xOff + dx), y2s = py(by);
          const segLen = Math.hypot(x2s - x1s, y2s - y1s);
          const gapF   = segLen > 0 ? 8 / segLen : 0;
          const crosses = crossMap.get(idx) || [];
          const underFs = crosses.filter(cr =>  cr.isUnder).map(cr => cr.t / dx);
          const overFs  = crosses.filter(cr => !cr.isUnder).map(cr => cr.t / dx);
          iSegs.push({x1s, y1s, x2s, y2s, hue, gapF, underFs, overFs});
          cumX += dx;
        }
        rSegs.push(iSegs);
      }
      segs.push(rSegs);
    }
    return segs;
  });

  // Zigzag lines and bight dots — clipped to the diagram rectangle.
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, py(MAX_Y), availDiagW, MAX_Y * scale);
  ctx.clip();

  // Pass 1: draw all segments for all components
  for (const segs of allSegs)
    for (const rSegs of segs)
      for (const iSegs of rSegs)
        for (const {x1s, y1s, x2s, y2s, hue} of iSegs) {
          ctx.lineWidth = 2; ctx.strokeStyle = hue;
          ctx.beginPath(); ctx.moveTo(x1s, y1s); ctx.lineTo(x2s, y2s); ctx.stroke();
        }

  // Pass 2: erase all under-crossings for all components
  ctx.strokeStyle = '#060610'; ctx.lineWidth = 5;
  for (const segs of allSegs)
    for (const rSegs of segs)
      for (const iSegs of rSegs)
        for (const {x1s, y1s, x2s, y2s, gapF, underFs} of iSegs)
          for (const tf of underFs) {
            const f0 = Math.max(0, tf - gapF), f1 = Math.min(1, tf + gapF);
            ctx.beginPath();
            ctx.moveTo(x1s + f0*(x2s-x1s), y1s + f0*(y2s-y1s));
            ctx.lineTo(x1s + f1*(x2s-x1s), y1s + f1*(y2s-y1s));
            ctx.stroke();
          }

  // Pass 3: thicken all over-crossings for all components
  ctx.lineWidth = 4;
  for (const segs of allSegs)
    for (const rSegs of segs)
      for (const iSegs of rSegs)
        for (const {x1s, y1s, x2s, y2s, hue, gapF, overFs} of iSegs) {
          ctx.strokeStyle = hue;
          for (const tf of overFs) {
            const f0 = Math.max(0, tf - gapF), f1 = Math.min(1, tf + gapF);
            ctx.beginPath();
            ctx.moveTo(x1s + f0*(x2s-x1s), y1s + f0*(y2s-y1s));
            ctx.lineTo(x1s + f1*(x2s-x1s), y1s + f1*(y2s-y1s));
            ctx.stroke();
          }
        }

  // Bight dots and labels for all components
  ctx.textAlign = 'center';
  for (let comp = 0; comp < g; comp++) {
    const bights = components[comp];
    const n      = bights.length;
    const bightLabel = new Array(n);
    const byY = new Map();
    for (let j = 0; j < n; j++) {
      const y = bights[j][1];
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(j);
    }
    for (const group of byY.values()) {
      group.sort((a, b) => bights[a][0] - bights[b][0]);
      group.forEach((j, idx) => { bightLabel[j] = idx; });
    }
    for (let r = rStart; r < REPS; r++) {
      const xOff = r * mod;
      for (let j = 0; j < n; j++) {
        const [x, y] = bights[j];
        const sx = px(x + xOff), sy = py(y);
        const prevY = bights[(j - 1 + n) % n][1];
        const nextY = bights[(j + 1) % n][1];
        const isTop = prevY < y && nextY < y;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(255,240,160,0.95)';
        ctx.fillText(String(bightLabel[j]), sx, isTop ? sy + 19 : sy - 12);
      }
    }
  }
  ctx.restore();

  // x-axis tick labels every 2 units below diagram, and above starting at first top-row bight
  ctx.fillStyle = 'rgba(180,205,255,0.75)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  const xStep    = 2;
  const topBight = components[0].find(([, y]) => y === MAX_Y);
  const topStart = topBight ? topBight[0] % xStep : 0;
  for (let x = 0; x <= totalW; x += xStep) {
    const sx = px(x);
    if (sx < ox || sx > ox + availDiagW) continue;
    ctx.fillText(String(x % mod), sx, py(0) + 14);
  }
  for (let x = topStart; x <= totalW; x += xStep) {
    const sx = px(x);
    if (sx < ox || sx > ox + availDiagW) continue;
    ctx.fillText(String(x % mod), sx, py(MAX_Y) - 6);
  }

  // Info line below the diagram: mod | zigzag | crossings
  const infoY = py(0) + 44;
  ctx.font = '13px monospace';
  ctx.fillStyle = 'rgba(180,205,255,0.75)';
  ctx.textAlign = 'left';
  ctx.fillText(`mod = ${mod}`, ox, infoY);
  ctx.textAlign = 'center';
  ctx.fillText(ZIGZAG.map(([x,y]) => `(${x},${y})`).join(' → '), ox + availDiagW / 2, infoY);
  ctx.textAlign = 'right';
  ctx.fillText(`${allCrossings.crossingCount} crossings`, ox + availDiagW, infoY);
}

function positionZigzagDisplay() {
  document.getElementById('zigzagDisplay').style.display = 'none';
}

document.getElementById('diagramToggle').addEventListener('click', () => {
  showDiagram = !showDiagram;
  diagramCanvas.style.display   = showDiagram ? 'block' : 'none';
  renderer.domElement.style.display = showDiagram ? 'none'  : 'block';
  document.getElementById('diagramToggle').textContent = showDiagram ? 'Knot' : 'Diagram';
  document.getElementById('xStretchSection').style.display = showDiagram ? '' : 'none';
  document.getElementById('knotSliders').style.display     = showDiagram ? 'none' : '';
  if (showDiagram) drawDiagram();
  else buildKnot(parseInt(document.getElementById('bInput').value));
  positionZigzagDisplay();
});

document.getElementById('componentToggle').addEventListener('click', () => {
  componentMode = !componentMode;
  document.getElementById('componentToggle').textContent = componentMode ? 'Full' : 'Period';
  const B = parseInt(document.getElementById('bInput').value);
  if (showDiagram) drawDiagram();
  else buildKnot(B);
});

window.addEventListener('resize', () => { if (showDiagram) { drawDiagram(); positionZigzagDisplay(); } });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && showDiagram) {
    showDiagram = false;
    diagramCanvas.style.display = 'none';
    renderer.domElement.style.display = 'block';
    document.getElementById('diagramToggle').textContent = 'Diagram';
    document.getElementById('xStretchSection').style.display = 'none';
    document.getElementById('knotSliders').style.display     = '';
    buildKnot(parseInt(document.getElementById('bInput').value));
    positionZigzagDisplay();
  }
});

document.getElementById('viewSlider').addEventListener('input', () => {
  const B = parseInt(document.getElementById('bInput').value);
  buildKnot(B);
});

document.getElementById('xStretchSlider').addEventListener('input', () => {
  if (showDiagram) drawDiagram();
});

// ── Tying sequence ─────────────────────────────────────────────────────────
function generateTyingSequence() {
  const B   = parseInt(document.getElementById('bInput').value);
  const mod = 2 * currentC * B;
  const bights = generateBights(B);
  const n = bights.length;

  // Row numbering: distinct y-values sorted ascending
  const yValues = [...new Set(bights.map(b => b[1]))].sort((a, b) => a - b);
  const yToRow  = new Map(yValues.map((y, i) => [y, i]));

  // Per-row bight labels (same as diagram: sort by x within row)
  const bightLabel = new Array(n);
  const byY = new Map();
  for (let j = 0; j < n; j++) {
    const y = bights[j][1];
    if (!byY.has(y)) byY.set(y, []);
    byY.get(y).push(j);
  }
  for (const group of byY.values()) {
    group.sort((a, b) => bights[a][0] - bights[b][0]);
    group.forEach((j, idx) => { bightLabel[j] = idx; });
  }

  // Cumulative arc-lengths
  const cumLen = [0];
  for (let i = 0; i < n; i++)
    cumLen.push(cumLen[i] + Math.abs(bights[(i+1)%n][1] - bights[i][1]));

  // Find all crossings
  const seen = new Map();
  for (let p = 0; p < n; p++) {
    const [ax, ay] = bights[p];
    const dxp = Math.abs(bights[(p+1)%n][1] - ay);
    if (bights[(p+1)%n][1] - ay <= 0) continue;
    for (let q = 0; q < n; q++) {
      const [cx, cy] = bights[q];
      const dxq = Math.abs(bights[(q+1)%n][1] - cy);
      if (bights[(q+1)%n][1] - cy >= 0) continue;
      const diffY = cy - ay;
      for (let t = 1; t < dxp; t++) {
        const u = diffY - t;
        if (u <= 0 || u >= dxq) continue;
        if ((ax + t) % mod !== (cx + u) % mod) continue;
        const key = `${(ax+t)%mod},${ay+t}`;
        if (!seen.has(key))
          seen.set(key, {p, q, tP: t, tQ: u, sP: cumLen[p]+t});
      }
    }
  }

  // Assign over/under by sP order
  const crossList = [...seen.values()].sort((a, b) => a.sP - b.sP);
  crossList.forEach((c, i) => { c.pIsOver = (i % 2 === 0); });
  const flip = needsParityFlip(crossList);
  if (flip) crossList.forEach(c => { c.pIsOver = !c.pIsOver; });

  // Per-segment crossing lists sorted by position along segment
  const segCrossings = Array.from({length: n}, () => []);
  for (const {p, q, tP, tQ, pIsOver} of crossList) {
    segCrossings[p].push({t: tP, other: q, isOver:  pIsOver});
    segCrossings[q].push({t: tQ, other: p, isOver: !pIsOver});
  }
  for (let i = 0; i < n; i++)
    segCrossings[i].sort((a, b) => a.t - b.t);

  // Build sequence
  const m = parseInt(document.getElementById('mInput').value);
  const lines = [
    `# Turk's Head Knot tying sequence`,
    `# ${m} leads × ${B} bights, complexity=${currentC}` +
      (currentC === 2 ? `  (a=${currentA}, b=${currentB})` : '') +
      (currentC === 3 ? `  (a=${c3A}, b=${c3B}, c=${c3C}, d=${c3D})` : ''),
    `# ${n} path bights, mod=${mod}, ${crossList.length} crossings`,
    ``
  ];

  for (let i = 0; i < n; i++) {
    const [, y] = bights[i];
    const prevY = bights[(i - 1 + n) % n][1];
    const nextY = bights[(i + 1) % n][1];
    const isTop = prevY < y && nextY < y;
    lines.push(`${isTop ? 'H' : 'L'}(${yToRow.get(y)},${bightLabel[i]})`);
    for (const {other, isOver} of segCrossings[i])
      if (other < i)
        lines.push(`  ${isOver ? 'O' : 'U'}`);
  }

  return lines.join('\n');
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const seq  = generateTyingSequence();
  const m    = parseInt(document.getElementById('mInput').value);
  const B    = parseInt(document.getElementById('bInput').value);
  const blob = new Blob([seq], {type: 'text/plain'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `knot_${m}L_${B}B.txt`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
});

// ── Initial state ──────────────────────────────────────────────────────────
buildKnot(4);

// ── Render loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

(function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (autoRotate) {
    const vt = parseFloat(document.getElementById('viewSlider').value);
    const axis = camera.position.clone().sub(orbit.target).normalize();
    knotGroup.rotateOnWorldAxis(axis, dt * (0.12 + 0.16 * vt));
  }
  orbit.update();
  renderer.render(scene, camera);
})();

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
