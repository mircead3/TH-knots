<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knot Visualizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060610; overflow: hidden; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }

      text-transform: uppercase;
      color: rgba(180, 195, 255, 0.35);
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      background: rgba(15, 15, 45, 0.9);
      border: 1px solid rgba(100, 130, 255, 0.22);
      border-radius: 6px;
      color: #c0c8e8;

      margin-bottom: 16px;
      outline: none;
    }
    select:focus { border-color: rgba(100, 130, 255, 0.5); }

    .b-input {
      width: 100%;
      background: rgba(15, 15, 45, 0.9);
      border: 1px solid rgba(100, 130, 255, 0.22);
      border-radius: 6px;
      color: #c0c8e8;
      padding: 8px;
      font-size: 20px;
      font-family: inherit;
      text-align: center;
      outline: none;
      margin-bottom: 18px;
    }
    .b-input:focus { border-color: rgba(100, 130, 255, 0.5); }
    .c-btn {
      flex: 1;
      background: rgba(15, 15, 45, 0.9);
      border: 1px solid rgba(100, 130, 255, 0.22);
      border-radius: 6px;
      color: #c0c8e8;
      padding: 7px 0;
      font-size: 18px;

      z-index: 10;

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ──────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060610);

const orthoCamera = new THREE.OrthographicCamera(-8, 8, 4, -4, 0.1, 100);
orthoCamera.position.set(0, 0, 20);
orthoCamera.lookAt(0, 0, 0);
let activeCamera = orthoCamera;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

// ── Controls ───────────────────────────────────────────────────────────────

const orthoOrbit = new OrbitControls(orthoCamera, renderer.domElement);
orthoOrbit.enableDamping = true;
orthoOrbit.dampingFactor = 0.07;
orthoOrbit.enabled = false;


// ── Lights ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x18183a, 4));

const keyLight = new THREE.DirectionalLight(0x8899ff, 4);
keyLight.position.set(6, 8, 6);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff7744, 2);
rimLight.position.set(-8, -4, -6);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x44ffcc, 1);
fillLight.position.set(0, -8, 5);
scene.add(fillLight);

// ── Zigzag knot definition ─────────────────────────────────────────────────
// For leads m, parameters a≥0 b≥0 (see validPairs for the exact bounds):
//   rows at y = 0, 2a, m+a-b, m+a+b
//   zigzag bights: (0,0) → (m+a-b, m+a-b) → (2m-2b, 2a) → (3m-a-b, m+a+b)
//   period = 4m,  d = 4  (always),  leads = m
//
// The four segments per period all run at 45° (slope ±1), so each one's length
// in diagonal units equals |Δx| = |Δy|:
//   P0→P1 (up)   : m + a − b
//   P1→P2 (down) : m − a − b      ← always the shortest (a,b ≥ 0)
//   P2→P3 (up)   : m − a + b
//   P3→P0'(down) : m + a + b      ← always the longest
// Σ = 4m = PERIOD; ascending total = descending total = 2m.
let ZIGZAG, PERIOD, D, LEADS, MAX_Y;

function setKnotDef(m, a, b) {
  ZIGZAG = [
    [0,           0          ],
    [m + a - b,   m + a - b  ],
    [2*m - 2*b,   2*a        ],
    [3*m - a - b, m + a + b  ],
  ];
  PERIOD = 4 * m;
  D      = 4;
  LEADS  = m;
  MAX_Y  = m + a + b;
}

function setKnotDefC1(m) {
  ZIGZAG = [[0, 0], [m, m]];
  PERIOD = 2 * m;
  D      = 2;
  LEADS  = m;
  MAX_Y  = m;
}

function setKnotDefC3(m, a, b, c, d) {
  const L = m;
  ZIGZAG = [
    [0,                  0              ],
    [3*L - c - d,        3*L - c - d    ],
    [3*L + a - c - d,    3*L - a - c - d],
    [3*L + a - c,        3*L - a - c    ],
    [3*L + a + b - c,    3*L - a - b - c],
    [3*L + a + b,        3*L - a - b    ],
  ];
  PERIOD = 6 * m;
  D      = 6;
  LEADS  = m;
  MAX_Y  = Math.max(3*L - c - d, 3*L - a - c, 3*L - a - b);
}

let currentC = 2;

function setKnotFromUI(m) {
  if (currentC === 1) { setKnotDefC1(m); return; }
  if (currentC === 2) {
    let [a, b] = getAB();
    if (knotFlipped) [a, b] = [b, a];      // flip = swap the two ascending segments
    setKnotDef(m, a, b);
  } else {
    let t = [c3A, c3B, c3C, c3D];
    if (knotFlipped) {
      const mm = c3AltMirror[c3ValidIdx];
      if (mm && mm[c3FormIdx]) t = mm[c3FormIdx];
    }
    setKnotDefC3(m, t[0], t[1], t[2], t[3]);
  }
}

setKnotDef(5, 1, 1); // initial values match the original example

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

// Generate the full list of bight [x,y] coordinates for B bights (in path order).
// In degenerate cases (e.g. a=b=0) the path closes before all B periods are
// exhausted; we detect this by stopping at the first return to the start bight.
function generateBights(B) {
  const mod = 2 * currentC * B;
  const bights = [];
  const seen = new Set();
  for (let k = 0; k < B; k++) {
    for (let j = 0; j < D; j++) {
      const [x, y] = ZIGZAG[j];
      const bx  = (x + k * PERIOD) % mod;
      const dir = Math.sign(ZIGZAG[(j + 1) % D][1] - y); // +1 leaving a v-bight, -1 a ^-bight
      const key = `${bx},${y},${dir}`;
      if (seen.has(key)) return bights;  // true closure: same point AND same direction
      seen.add(key);
      bights.push([bx, y]);
    }
  }
  return bights;
}

// Sort all crossing encounters (ascending + descending) by path position and
// assign alternating over/under. Returns bool[] where true = ascending is over.
function alternatingOverUnder(ascPos, descPos) {
  const n = ascPos.length;
  const enc = [];
  for (let i = 0; i < n; i++) {
    enc.push({pos: ascPos[i], idx: i, asc: true});
    enc.push({pos: descPos[i], idx: i, asc: false});
  }
  enc.sort((a, b) => a.pos - b.pos);
  const rank = new Array(n);
  enc.forEach((e, r) => { if (e.asc) rank[e.idx] = r; });
  return rank.map(r => r % 2 === 0);
}

// Return true if the parity of crossing assignments should be flipped so that
// the first crossing encountered during tying (min segment index, then min t)
// is an over-crossing for the later strand.
// crossings must be sorted by sP with pIsOver = (i%2===0) already set.
function needsParityFlip(crossings) {
  let bestSeg = Infinity, bestT = Infinity, firstIsOver = true;
  for (const {p, q, tP, tQ, pIsOver} of crossings) {
    const laterSeg   = Math.max(p, q);
    const tOnLater   = p > q ? tP : tQ;
    const isOverLater = p > q ? pIsOver : !pIsOver;
    if (laterSeg < bestSeg || (laterSeg === bestSeg && tOnLater < bestT)) {
      bestSeg = laterSeg; bestT = tOnLater; firstIsOver = isOverLater;
    }
  }
  return !firstIsOver;
}

// Generate all g = gcd(LEADS, B) components of the TH link.
// Component j is component 0 with all bight x-coordinates shifted by j × gcd(PERIOD, mod) / g.
function generateAllComponents(B) {
  const mod  = 2 * currentC * B;
  const base = generateBights(B);
  const g    = gcd(LEADS, B);
  if (g === 1) return [base];
  const shift = gcd(PERIOD, mod) / g;
  const components = [base];
  for (let j = 1; j < g; j++) {
    const off = j * shift;
    components.push(base.map(([x, y]) => [(x + off) % mod, y]));
  }
  return components;
}


// ── Scene objects ──────────────────────────────────────────────────────────
const knotGroup = new THREE.Group();
scene.add(knotGroup);

function buildTubeDiagram() {
  knotGroup.scale.setScalar(1);   // straight view may have shrunk it
  while (knotGroup.children.length) {
    const child = knotGroup.children[0];
    child.geometry.dispose(); child.material.dispose(); knotGroup.remove(child);
  }
  knotGroup.rotation.set(0, 0, 0);

  const tubeRadius = parseFloat(document.getElementById('thickInput').value);
  const xStretch   = parseFloat(document.getElementById('xStretchSlider').value);
  const scaleY     = 8;
  const delta      = tubeRadius * 3;
  const bightInset      = 0.5;
  const bightInsetExtra = 0.7;  // added when no crossing within t=1 on either adjacent segment
  const pad        = tubeRadius * 2;
  const oH         = scaleY * 1.6 + pad;

  const unitScaleY = scaleY / MAX_Y;
  const unitScaleX = unitScaleY * xStretch;

  // step = PERIOD / LEADS = D (always, since PERIOD = D*m and LEADS = m)
  const step = PERIOD / LEADS;

  // Camera: fixed aspect, content scales with xStretch
  const PANEL_W    = 235;
  const aspect     = (innerWidth - PANEL_W) / innerHeight;
  const oW         = oH * aspect;
  const REPS       = Math.max(1, Math.ceil(oW / (PERIOD * unitScaleX)));
  const centerAbsX = oW / (2 * unitScaleX);

  orthoCamera.left = -oW / 2; orthoCamera.right = oW / 2;
  orthoCamera.top  =  oH / 2; orthoCamera.bottom = -oH / 2;
  orthoCamera.updateProjectionMatrix();

  const toFlat = (absX, y, z = 0) => new THREE.Vector3(
    (absX - centerAbsX) * unitScaleX,
    (y    - MAX_Y / 2)  * unitScaleY,
    z
  );

  // ── B-free crossing computation ────────────────────────────────────────────
  // Find all crossings between the LEADS strands from ZIGZAG geometry alone.
  // Each upward segment of strand k1 is intersected with each downward segment
  // of strand k2 (k1 ≠ k2), trying a small range of period offsets r2.
  const strandCrossings = Array.from({length: LEADS}, () =>
    Array.from({length: D}, () => []));

  const raw = [];
  for (let k1 = 0; k1 < LEADS; k1++) {
    const xk1 = k1 * step;
    for (let s1 = 0; s1 < D; s1++) {
      const s1n = (s1 + 1) % D;
      const A1x = ZIGZAG[s1][0] + xk1;
      const A1y = ZIGZAG[s1][1];
      const B1y = ZIGZAG[s1n][1];
      if (B1y <= A1y) continue;           // upward segments only for k1
      const len1 = B1y - A1y;             // segment length (slope=±1 ⟹ |dx|=|dy|)

      for (let k2 = 0; k2 < LEADS; k2++) {
        if (k1 === k2) continue;
        const xk2 = k2 * step;
        for (let s2 = 0; s2 < D; s2++) {
          const s2n = (s2 + 1) % D;
          const A2y = ZIGZAG[s2][1];
          const B2y = ZIGZAG[s2n][1];
          if (B2y >= A2y) continue;       // downward segments only for k2
          const len2 = A2y - B2y;

          for (let r2 = -2; r2 <= 2; r2++) {
            const A2x = ZIGZAG[s2][0] + xk2 + r2 * PERIOD;
            const t1  = (A2x + A2y - A1x - A1y) / 2;
            const t2  = (A2y - A1y + A1x - A2x) / 2;
            const yc  = A1y + t1;
            if (t1 <= 0 || t1 >= len1) continue;
            if (t2 <= 0 || t2 >= len2) continue;
            if (yc  <= 0 || yc  >= MAX_Y) continue;
            raw.push({k1, s1, t1, k2, s2, t2, y: yc});
          }
        }
      }
    }
  }

  // Over/under: BFS through strands, each processed in its own path order.
  // alternatingOverUnder() cannot be used here because the two sides of each
  // crossing are on *different* strands, so mixing their positions is meaningless.
  const segCumLen = [0];
  for (let s = 0; s < D; s++)
    segCumLen.push(segCumLen[s] + Math.abs(ZIGZAG[(s+1)%D][1] - ZIGZAG[s][1]));

  const strandEnc = Array.from({length: LEADS}, () => []);
  raw.forEach((c, i) => {
    strandEnc[c.k1].push({pos: segCumLen[c.s1] + c.t1, idx: i, asK1: true});
    strandEnc[c.k2].push({pos: segCumLen[c.s2] + c.t2, idx: i, asK1: false});
  });
  for (let k = 0; k < LEADS; k++) strandEnc[k].sort((a, b) => a.pos - b.pos);

  const rankOf = strandEnc.map(enc => {
    const m = new Map();
    enc.forEach((e, r) => m.set(e.idx, r));
    return m;
  });

  const k1IsOverArr  = new Array(raw.length).fill(null);
  const strandFlip   = new Array(LEADS).fill(null);
  strandFlip[0] = false;
  const bfsQueue = [0];
  while (bfsQueue.length) {
    const k    = bfsQueue.shift();
    const flip = strandFlip[k];
    for (const {idx, asK1} of strandEnc[k]) {
      const r      = rankOf[k].get(idx);
      const myOver = ((r % 2 === 0) !== flip);
      const k1Over = asK1 ? myOver : !myOver;
      if (k1IsOverArr[idx] === null) k1IsOverArr[idx] = k1Over;
      const otherK   = asK1 ? raw[idx].k2 : raw[idx].k1;
      if (strandFlip[otherK] === null) {
        const otherR   = rankOf[otherK].get(idx);
        const otherExp = asK1 ? !k1Over : k1Over;
        strandFlip[otherK] = ((otherR % 2 === 0) !== otherExp);
        bfsQueue.push(otherK);
      }
    }
  }
  raw.forEach((c, i) => { c.k1IsOver = k1IsOverArr[i] ?? true; });

  // Parity flip: the crossing where the "later" strand (max segment index)
  // first appears should be the over-crossing — same rule as needsParityFlip.
  let bestSeg = Infinity, bestT = Infinity, firstIsOver = true;
  for (const c of raw) {
    const laterSeg    = Math.max(c.s1, c.s2);
    const tOnLater    = c.s1 > c.s2 ? c.t1 : c.t2;
    const isOverLater = c.s1 > c.s2 ? c.k1IsOver : !c.k1IsOver;
    if (laterSeg < bestSeg || (laterSeg === bestSeg && tOnLater < bestT)) {
      bestSeg = laterSeg; bestT = tOnLater; firstIsOver = isOverLater;
    }
  }
  if (!firstIsOver) raw.forEach(c => { c.k1IsOver = !c.k1IsOver; });

  for (const c of raw) {
    strandCrossings[c.k1][c.s1].push({t: c.t1, y: c.y, isOver:  c.k1IsOver});
    strandCrossings[c.k2][c.s2].push({t: c.t2, y: c.y, isOver: !c.k1IsOver});
  }
  for (let k = 0; k < LEADS; k++)
    for (let s = 0; s < D; s++)
      strandCrossings[k][s].sort((a, b) => a.t - b.t);

  // Per-strand bight y-adjustment: inset inward; use larger inset when no
  // crossing is within diagonal-distance 1 (t=1) on either adjacent segment.
  const bightYAdj = Array.from({length: LEADS}, (_, k) =>
    ZIGZAG.map((pt, s) => {
      const dir    = ZIGZAG[(s + 1) % D][1] >= pt[1] ? 1 : -1;
      const inSeg  = (s - 1 + D) % D;
      const lenIn  = Math.abs(pt[1] - ZIGZAG[inSeg][1]);
      const closeIn  = strandCrossings[k][inSeg].some(c => c.t >= lenIn - 1);
      const closeOut = strandCrossings[k][s].some(c => c.t <= 1);
      const inset  = bightInset + (closeIn || closeOut ? 0 : bightInsetExtra);
      return pt[1] + dir * inset;
    })
  );

  // ── One tube per strand ────────────────────────────────────────────────────
  const tmp        = new THREE.Color();
  const radialSegs = 32;

  const strandCount = componentMode ? 1 : LEADS;
  for (let k = 0; k < strandCount; k++) {
    const xk  = k * step;
    const pts = [];

    for (let r = -1; r < REPS; r++) {
      const rOff = r * PERIOD + xk;

      for (let s = 0; s < D; s++) {
        const sn = (s + 1) % D;
        const Ax = ZIGZAG[s][0]  + rOff;
        const Ay = ZIGZAG[s][1];
        const Bx = ZIGZAG[sn][0] + rOff + (s === D - 1 ? PERIOD : 0);
        const By = ZIGZAG[sn][1];

        if (pts.length === 0) pts.push(toFlat(Ax, bightYAdj[k][s], 0));

        for (const {t, y, isOver} of strandCrossings[k][s])
          pts.push(toFlat(Ax + t, y, isOver ? delta : -delta));

        pts.push(toFlat(Bx, bightYAdj[k][sn], 0));
      }
    }

    if (pts.length < 2) continue;

    tmp.setHSL(k / LEADS, 0.9, 0.62);

    const curve       = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
    const tubularSegs = Math.max(pts.length * 12, 60);
    const geo         = new THREE.TubeGeometry(curve, tubularSegs, tubeRadius, radialSegs, false);

    const ringCount    = tubularSegs + 1;
    const vertsPerRing = radialSegs + 1;
    const cols         = new Float32Array(ringCount * vertsPerRing * 3);
    for (let vi = 0; vi < ringCount * vertsPerRing; vi++) {
      cols[vi*3] = tmp.r; cols[vi*3+1] = tmp.g; cols[vi*3+2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, specular: new THREE.Color(0xffffff), shininess: 140,
    }));
    mesh.frustumCulled = false;
    knotGroup.add(mesh);
  }

  if (showBights) {
    const sphereR   = tubeRadius * 0.75;
    const sphereGeo = new THREE.SphereGeometry(sphereR, 8, 8);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let k = 0; k < strandCount; k++) {
      const xk = k * step;
      for (let r = -1; r < REPS; r++) {
        const rOff = r * PERIOD + xk;
        for (let s = 0; s < D; s++) {
          const sn = (s + 1) % D;
          const Bx = ZIGZAG[sn][0] + rOff + (s === D - 1 ? PERIOD : 0);
          const By = ZIGZAG[sn][1];
          const sphere = new THREE.Mesh(sphereGeo, sphereMat);
          sphere.position.copy(toFlat(Bx, By, 0));
          sphere.frustumCulled = false;
          knotGroup.add(sphere);
        }
      }
    }
  }
}

// Number of different knots/links for the current C and L, shown under Leads.

    `${n} knot${n === 1 ? '' : 's'}`;

// ── View state ─────────────────────────────────────────────────────────────

// ── UI wiring ──────────────────────────────────────────────────────────────
let currentA = 1, currentB = 1;
let ab2ValidList = [], ab2ValidIdx = -1;
let ab2ListCacheM = -1;
let c3A = 2, c3B = 2, c3C = 2, c3D = 2;
let c3ValidList = [], c3ValidIdx = -1;
let c3MirrorList = [];          // c3MirrorList[i] = valid (a,b,c,d) for list[i]'s mirror
let c3AltList = [];             // c3AltList[i] = distinct equivalent diagrams of knot i (forms); [0] = representative
let c3AltMirror = [];           // c3AltMirror[i][j] = valid mirror tuple of c3AltList[i][j]
let c3FormIdx = 0;              // which form of the current knot is displayed
let c3ListCacheM = -1;
let knotFlipped = false;        // flip button: render the mirror image in place
let mDisplayed = null;          // L stepper: the leads count we have actually built
let mStepTimer = null;
let componentMode = false;

function hasAllCrossings(components, mod) {
  const nC = components.length;
  const covered = components.map(comp => new Uint8Array(comp.length));
  let remaining = components.reduce((s, c) => s + c.length, 0);
  outer:
  for (let ci = 0; ci < nC; ci++) {
    const bP = components[ci], np = bP.length;
    for (let p = 0; p < np; p++) {
      const [ax, ay] = bP[p];
      const dxp = bP[(p+1)%np][1] - ay;
      if (dxp <= 0) continue;
      for (let cj = 0; cj < nC; cj++) {
        const bQ = components[cj], nq = bQ.length;
        for (let q = 0; q < nq; q++) {
          if (covered[ci][p] && covered[cj][q]) continue;
          const [cx, cy] = bQ[q];
          const dxq = cy - bQ[(q+1)%nq][1];
          if (dxq <= 0) continue;
          const diffY = cy - ay;
          for (let t = 1; t < dxp; t++) {
            const u = diffY - t;
            if (u <= 0) break;
            if (u >= dxq) continue;
            if ((ax + t) % mod !== (cx + u) % mod) continue;
            if (!covered[ci][p]) { covered[ci][p] = 1; remaining--; }
            if (!covered[cj][q]) { covered[cj][q] = 1; remaining--; }
            if (remaining === 0) break outer;
            break;
          }
        }
      }
    }
  }
  return remaining === 0;
}

function computeValidC3(m) {
  const L3 = 3 * m;
  const list = [];
  for (let a = 2; a <= L3 - 4; a++) {
    if (a % 3 === 0) continue;
    // b must have b%3 === a%3 to avoid b%3=0 and (a+b)%3=0; step by 3.
    const bRem = a % 3;
    // Only skip b where (a+b)%3=0: structurally impossible (needs d >= a+b, but d <= a+b-c with c>=2).
    // b%3=0 is allowed when c+d <= b (ascending segs 2&4 have disjoint y-ranges then).
    for (let b = 2; b <= L3 - a - 2; b++) {
      if (b % 3 === (3 - bRem) % 3) continue;
      for (let c = 2; c <= Math.min(L3 - a - b, a + b - 2); c++) {
        if (c % 3 === 0) continue;
        const dMax = Math.min(L3 - a - c, a + b - c);
        // d%3=0 always bad (adjacent descending segs always overlap).
        // b%3=0 or (c+d)%3=0 bad only when c+d > b; when c+d <= b y-ranges are disjoint.
        for (let d = 2; d <= dMax; d++) {
          if (d % 3 === 0) continue;
          if ((b % 3 === 0 || (c + d) % 3 === 0) && c + d > b) continue;
          if (a + b === c + d && b < d) continue;
          // When a+c+d = 3m: require (a > d & b >= c) or (a = d & b > c & a = b).
          if (a + c + d === L3 && !((a > d && b >= c) || (a === d && b > c && a === b))) continue;
          // When a+b+c = 3m: require a >= d.
          if (a + b + c === L3 && a < d) continue;
          // Crossing test, O(1) (hasAllCrossings kept elsewhere as the reference
          // impl): a segment is uncrossed iff its length is 2 and the inner
          // ascending ranges are disjoint (c+d <= b).  Verified identical to the
          // brute-force scan for m=3..18 (112k tuples, 0 diffs).  The former
          // per-tuple bight-closure check is dropped too — it never fired
          // (0 early-closures, m=3..18) and made stepping the leads count
          // sluggish (which skipped values on key-repeat).
          const seg = [L3 - c - d, a, d, b, c, L3 - a - b];
          if (c + d > b || !seg.includes(2)) list.push([a, b, c, d]);
        }
      }
    }
  }
  return list;
}

// ── Knot-identity dedup (C=3) ──────────────────────────────────────────────
// computeValidC3 removes only *segment-sequence* duplicates; genuinely equal
// knots still appear under different (a,b,c,d) — they differ by a flype, so the
// diagrams differ but the knot is the same.  We dedup by the canonical
// over/under Gauss code, which for these prime reduced *alternating* diagrams
// is a knot invariant: equal code ⇒ same knot, so no distinct knot is ever
// dropped (the only residual risk is a flype-related duplicate slipping
// through).  Mirrors are folded in (policy: collapse mirrors, keep flip button).
// Computed at the smallest bight count coprime to m — fewest crossings, and the
// knot identity is bight-independent.
function smallestCoprimeB(m) { let B = 2; while (gcd(m, B) !== 1) B++; return B; }

// Distinct bight rows of (a,b,c,d).  We keep the representative with the MOST
// rows: the most generic diagram, giving the tensegrity optimizer the most
// degrees of freedom and the least degeneracy.
function c3RowCount(m, a, b, c, d) {
  const L = m;
  return new Set([0, 3*L-c-d, 3*L-a-c-d, 3*L-a-c, 3*L-a-b-c, 3*L-a-b]).size;
}

// Booth's algorithm: index of the lexicographically least rotation of S.
function boothLeastRotation(S) {
  const N = S.length;
  const f = new Int32Array(2 * N).fill(-1);
  let k = 0;
  for (let j = 1; j < 2 * N; j++) {
    const sj = S[j % N];
    let i = f[j - k - 1];
    while (i !== -1 && sj !== S[(k + i + 1) % N]) {
      if (sj < S[(k + i + 1) % N]) k = j - i - 1;
      i = f[i];
    }
    if (sj !== S[(k + i + 1) % N]) {
      if (sj < S[k % N]) k = j;
      f[j - k] = -1;
    } else {
      f[j - k] = i + 1;
    }
  }
  return k;
}

// Canonical key of an over/under Gauss sequence (array of [label, overBit]),
// folding rotation, reversal and mirror.  Uses a gap encoding — each position
// carries the cyclic distance to its crossing's partner occurrence (rotation-
// invariant, fixed alphabet) plus the over/under bit — so the minimal rotation
// is O(n) via Booth's algorithm.  Verified to yield the identical partition to
// the naive relabel-every-rotation canon for m = 3..18.
function c3CanonGauss(seq) {
  const N = seq.length;
  const tokensOf = base => {
    const partner = new Int32Array(N);
    const posMap = new Map();
    for (let i = 0; i < N; i++) {
      const lab = base[i][0];
      if (posMap.has(lab)) { const j = posMap.get(lab); partner[i] = j; partner[j] = i; }
      else posMap.set(lab, i);
    }
    const t = new Int32Array(N);
    for (let i = 0; i < N; i++) t[i] = ((((partner[i] - i) % N) + N) % N) * 2 + base[i][1];
    return t;
  };
  const keyOf = t => {
    const k = boothLeastRotation(t), out = new Array(N);
    for (let i = 0; i < N; i++) out[i] = t[(k + i) % N];
    return out.join(',');
  };
  const rev = seq.slice().reverse();
  let best = null;
  for (const base of [seq, rev]) {
    const t0 = tokensOf(base);
    const tm = tokensOf(base.map(([lab, o]) => [lab, o ^ 1]));
    for (const t of [t0, tm]) { const kk = keyOf(t); if (best === null || kk < best) best = kk; }
  }
  return best;
}

// Canonical over/under Gauss code (string) for the C=3 knot (a,b,c,d).
function c3GaussKey(m, a, b, c, d) {
  const L = m, B = smallestCoprimeB(m), mod = 6 * B, half = mod >> 1, PER = 6 * m, D = 6;
  const ZIG = [[0,0],[3*L-c-d,3*L-c-d],[3*L+a-c-d,3*L-a-c-d],
               [3*L+a-c,3*L-a-c],[3*L+a+b-c,3*L-a-b-c],[3*L+a+b,3*L-a-b]];
  const bP = []; const seenB = new Set();
  outer:
  for (let k = 0; k < B; k++)
    for (let j = 0; j < D; j++) {
      const x = ZIG[j][0], y = ZIG[j][1];
      const bx = (((x + k*PER) % mod) + mod) % mod;
      const dy = ZIG[(j+1)%D][1] - y, nd = dy > 0 ? 1 : dy < 0 ? -1 : 0;
      const key = bx + ',' + y + ',' + nd;
      if (seenB.has(key)) break outer;
      seenB.add(key); bP.push([bx, y]);
    }
  const npt = bP.length;
  const cr = new Map();
  for (let p = 0; p < npt; p++) {
    const ax = bP[p][0], ay = bP[p][1], dxp = bP[(p+1)%npt][1] - ay;
    if (dxp <= 0) continue;
    for (let q = 0; q < npt; q++) {
      const cy = bP[q][1], cx = bP[q][0], dxq = cy - bP[(q+1)%npt][1];
      if (dxq <= 0) continue;
      const diffY = cy - ay;
      // A crossing needs (ax+t) ≡ (cx+u) (mod mod) with u = diffY−t, i.e.
      // 2t ≡ cx+diffY−ax (mod mod).  Solve directly instead of scanning t.
      const K = (((cx + diffY - ax) % mod) + mod) % mod;
      if (K % 2 !== 0) continue;
      const t0 = (K >> 1) % half;
      const tlo = Math.max(1, diffY - dxq + 1), thi = Math.min(dxp - 1, diffY - 1);
      if (tlo > thi) continue;
      for (let t = tlo + (((t0 - tlo) % half) + half) % half; t <= thi; t += half) {
        const u = diffY - t;
        const kk = ((((ax+t)%mod)+mod)%mod) + ',' + (ay+t);
        if (!cr.has(kk)) cr.set(kk, {p, t, q, u});
      }
    }
  }
  const lst = [...cr.values()];
  const cum = [0];
  for (let i = 0; i < npt; i++) cum.push(cum[i] + Math.abs(bP[(i+1)%npt][1] - bP[i][1]));
  const enc = [];
  lst.forEach((c2, i) => { enc.push([cum[c2.p]+c2.t, i, true]); enc.push([cum[c2.q]+c2.u, i, false]); });
  enc.sort((A, Bb) => A[0] - Bb[0]);
  const rank = new Array(lst.length);
  enc.forEach((e, r) => { if (e[2]) rank[e[1]] = r; });
  let over = lst.map((_, i) => rank[i] % 2 === 0);
  let bestSeg = Infinity, bestT = Infinity, fio = true;
  lst.forEach((c2, i) => {
    const laterSeg = Math.max(c2.p, c2.q);
    const tOnLater = c2.p > c2.q ? c2.t : c2.u;
    const isOverLater = c2.p > c2.q ? over[i] : !over[i];
    if (laterSeg < bestSeg || (laterSeg === bestSeg && tOnLater < bestT)) {
      bestSeg = laterSeg; bestT = tOnLater; fio = isOverLater;
    }
  });
  if (!fio) over = over.map(o => !o);
  const enc2 = [];
  lst.forEach((c2, i) => { enc2.push([cum[c2.p]+c2.t, i, over[i]]); enc2.push([cum[c2.q]+c2.u, i, !over[i]]); });
  enc2.sort((A, Bb) => A[0] - Bb[0]);
  const seq = enc2.map(e => [e[1], e[2] ? 1 : 0]);
  return c3CanonGauss(seq);
}

// Dedup a raw C=3 list to one representative per knot (mirrors folded in).
// Returns { list, mirror }: mirror[i] is a valid (a,b,c,d) drawing of list[i]'s
// mirror image (for the flip button), or list[i] itself when self-mirror.
function dedupC3(m, raw) {
  const ckey = t => c3CanonKey(c3Seq(t[0], t[1], t[2], t[3], m));
  const cmp = (t, r) => t[0]<r[0] || (t[0]===r[0] && (t[1]<r[1] ||
              (t[1]===r[1] && (t[2]<r[2] || (t[2]===r[2] && t[3]<r[3])))));
  const groups = new Map();
  for (const t of raw) {
    const k = c3GaussKey(m, t[0], t[1], t[2], t[3]);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  // Representative: prefer a flip-symmetric diagram (so Shift+arrow can reach the
  // knot), then most bight rows, then lexicographically smallest.
  const fkey = t => c3CanonKey(c3FlipSeq(t[0], t[1], t[2], t[3], m));
  const isSym = t => ckey(t) === fkey(t);
  const orbitOf = t => { const a = ckey(t), b = fkey(t); return a < b ? a + '|' + b : b + '|' + a; };
  const list = [], mirror = [], alt = [], altMirror = [];
  for (const members of groups.values()) {
    const sym = members.filter(isSym);
    const pool = sym.length ? sym : members;
    let rep = pool[0], repRows = c3RowCount(m, rep[0], rep[1], rep[2], rep[3]);
    for (const t of pool) {
      const rows = c3RowCount(m, t[0], t[1], t[2], t[3]);
      if (rows > repRows || (rows === repRows && cmp(t, rep))) { rep = t; repRows = rows; }
    }
    // Distinct equivalent diagrams (forms): one per flip-orbit — same-chirality
    // only, since the Flip button reaches the mirror.  rep first, then the rest
    // ordered symmetric-first, most rows, lexicographic.
    const byKey = new Map();               // one lex-min tuple per diagram (ckey)
    for (const t of members) { const k = ckey(t); const c = byKey.get(k); if (!c || cmp(t, c)) byKey.set(k, t); }
    const used = new Set([orbitOf(rep)]);
    const others = [];
    for (const t of byKey.values()) { const o = orbitOf(t); if (used.has(o)) continue; used.add(o); others.push(t); }
    others.sort((x, y) => {
      const s = (isSym(x) ? 0 : 1) - (isSym(y) ? 0 : 1); if (s) return s;
      const r = c3RowCount(m, y[0], y[1], y[2], y[3]) - c3RowCount(m, x[0], x[1], x[2], x[3]); if (r) return r;
      return cmp(x, y) ? -1 : (cmp(y, x) ? 1 : 0);
    });
    const forms = [rep, ...others];
    const formMir = forms.map(f => { const fk = fkey(f); return members.find(t => ckey(t) === fk) || f; });
    list.push(rep);
    mirror.push(formMir[0]);
    alt.push(forms);
    altMirror.push(formMir);
  }
  return { list, mirror, alt, altMirror };
}

function syncC3List(m) {
  if (m !== c3ListCacheM) {
    const dd = dedupC3(m, computeValidC3(m));
    c3ValidList = dd.list; c3MirrorList = dd.mirror; c3AltList = dd.alt; c3AltMirror = dd.altMirror;
    c3ListCacheM = m;
    c3ValidIdx = 0; c3FormIdx = 0;
    if (c3ValidList.length > 0) [c3A, c3B, c3C, c3D] = c3ValidList[0];
  } else {
    // Keep the current knot (and form) if the shown tuple is one of its forms;
    // otherwise resolve the index from the tuple and reset to the base form.
    const forms = c3AltList[c3ValidIdx];
    const onForm = forms && forms.some(([a,b,c,d]) => a===c3A && b===c3B && c===c3C && d===c3D);
    if (!onForm) {
      c3ValidIdx = c3ValidList.findIndex(([a,b,c,d]) => a===c3A && b===c3B && c===c3C && d===c3D);
      c3FormIdx = 0;
      if (c3ValidIdx < 0 && c3ValidList.length > 0) {
        c3ValidIdx = 0;
        [c3A, c3B, c3C, c3D] = c3ValidList[0];
      }
    }
  }
  updateC3Display();
  return c3ValidList.length > 0;
}

// Valid (a,b) for C=2.  The two restrictions together are exactly
// "all four zigzag segments are odd and ≥ 3":
//
//  • Parity — all four segment lengths share the parity of (m+a+b), because
//    m+a−b ≡ m−a−b ≡ m−a+b ≡ m+a+b  (mod 2)  (−b ≡ +b, −a ≡ +a).
//    So requiring (m−a−b) odd makes ALL four lengths odd at once.
//
//  • a+b ≤ m−3 — the shortest segment is L1 = m−a−b (since a,b ≥ 0, it is ≤ the
//    other three).  Hence "all segments ≥ 3" ⟺ L1 ≥ 3 ⟺ a+b ≤ m−3.  This is
//    exactly the cap below; L0 = m+a−b ≥ 2a+3 and L2 = m−a+b ≥ 2b+3 then follow.
//
// Why ≥ 3 (and odd, so never 1 or 2): a segment of length 1 has no crossing
// point between its two bights, collapsing the knot to an uninteresting C=1
// knot.  Excluding (0,0) drops the trivial all-diagonal case.
//
// No duplicates — enforced by a,b ≥ 0 alone (no extra dedup conditions needed,
// unlike C=3).  The picture-preserving symmetries of the 4-segment sequence
// s(a,b) = [m+a−b, m−a−b, m−a+b, m+a+b] are rotate-by-2 and path reversal.
// Requiring the image to again be a valid s(A,B) (A,B ≥ 0) forces:
//   • rotate-by-2     → A+B = −(a+b)  ⟹  a=b=0
//   • reversal        → A=a, B=−b     ⟹  b=0   (maps (a,0) to itself)
//   • rotate+reversal → A=−a, B=b     ⟹  a=0   (maps (0,b) to itself)
// i.e. a symmetry can only ever map a pair to ITSELF, so no two different (a,b)
// produce the same knot.  (b=0 / a=0 just mean that knot is self-reverse.)
//
// Flip: flipping is (a,b) → (b,a), which swaps the two ascending segments
// L0 ↔ L2 and leaves L1, L3 fixed.  A knot equals its own flip iff L0 = L2,
// i.e. m+a−b = m−a+b ⟺ a = b (no other cases: L1 = m−a−b is the strict min and
// L3 = m+a+b the strict max for (a,b) ≠ (0,0), so no symmetry can swap them).
// Hence the distinct-knot count is (N + #{a==b}) / 2.
function validPairs(m) {
  const pairs = [];
  // a ≤ b keeps one of each mirror pair (a,b)/(b,a) — the complete dedup for
  // C=2 (its only same-knot symmetry is the transpose = flip).  The flip button
  // still reaches the (b,a) mirror in place.
  for (let a = 0; a <= m - 3; a++)
    for (let b = a; a + b <= m - 3; b++)
      if ((m - a - b) % 2 === 1 && !(a === 0 && b === 0)) pairs.push([a, b]);
  return pairs;
}

function minBights() { return currentC === 1 ? 2 : 1; }

function rebuildKnot() {

  if (currentC === 2 && ab2ValidList.length === 0) return;
  if (currentC === 3 && c3ValidList.length === 0) return;
  setKnotFromUI(m);
  if (showDiagram) drawDiagram();

  else if (showRoundDiag) drawRoundDiagram();
  else if (showStraight) buildStraight();
  else if (showKnot) buildKnot();
  else buildKnot();

// Build everything for a specific leads count m (no input reads/writes).
function buildForM(m) {
  knotFlipped = false;
  if (currentC === 2 && !syncAB2List(m)) return;
  if (currentC === 3 && !syncC3List(m)) return;
  setKnotFromUI(m);
  if (showDiagram) drawDiagram();
  else if (showTubeDiag) buildTubeDiagram();
  else if (showRoundDiag) drawRoundDiagram();
  else if (showStraight) buildStraight();
  else buildKnot();
}

// The per-L rebuild can take ~1s at large L.  The native number-input spinner
// causes two problems: it fires input+change per click, and if we build (and
// freeze the thread) mid-click the spinner auto-repeats and adds a spurious
// extra step.  So we DEBOUNCE — wait ~250ms for the interaction to settle, then
// walk L one step at a time toward the input's value, building every
// intermediate and yielding between steps.  A click lands on exactly the next
// value; nothing is skipped or doubled.
function scheduleMStep() {
  clearTimeout(mStepTimer);
  mStepTimer = setTimeout(mWalk, 250);
}

function mWalk() {
  const mInput = document.getElementById('mInput');
  let target = parseInt(mInput.value);
  if (isNaN(target)) { mInput.value = mDisplayed; return; }
  target = Math.max(minLeads(), Math.min(parseInt(mInput.max) || 30, target));
  if (String(target) !== mInput.value) mInput.value = target;   // clamp display
  if (mDisplayed === null) mDisplayed = target;
  if (mDisplayed === target) return;
  mDisplayed += Math.sign(target - mDisplayed);                 // exactly one step
  buildForM(mDisplayed);
  if (mDisplayed !== target) mStepTimer = setTimeout(mWalk, 0); // settled → keep walking
}

document.getElementById('mInput').addEventListener('input', scheduleMStep);
mDisplayed = parseInt(document.getElementById('mInput').value);

});

document.addEventListener('keydown', e => {
  if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  // Build mode (tensegrity): arrows step the build sequence instead of the knot list.
  if (showStraight && buildMode) {
    e.preventDefault();
    buildStep += (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 1 : -1;
    if (buildStep < 0) buildStep = 0;
    buildStraight();
    return;
  }
  knotFlipped = false;   // stepping to a new knot clears any flip
  const dir = (e.key === 'ArrowUp' || e.key === 'ArrowRight') ? 1 : -1;
  // Shift+arrow: step only through flip-symmetric (self-flip) entries.  Walk the
  // list in `dir` until we land on a symmetric entry; if none exist, do nothing.
  const nextIdx = (list, idx, isSym) => {
    const n = list.length;
    if (!e.shiftKey) return (idx + dir + n) % n;
    for (let step = 1; step <= n; step++) {
      const j = (idx + dir * step + n * step) % n;
      if (isSym(list[j])) return j;
    }
    return -1;  // no symmetric entry found
  };
  if (currentC === 2 && ab2ValidList.length > 0) {
    e.preventDefault();
    const j = nextIdx(ab2ValidList, ab2ValidIdx, ([a, b]) => a === b);

  } else if (currentC === 3 && c3ValidList.length > 0) {
    e.preventDefault();
    const m = parseInt(document.getElementById('mInput').value);
    const j = nextIdx(c3ValidList, c3ValidIdx, ([a, b, c, d]) =>
      c3CanonKey(c3Seq(a, b, c, d, m)) === c3CanonKey(c3FlipSeq(a, b, c, d, m)));
    if (j < 0) return;
    c3ValidIdx = j; c3FormIdx = 0;
    [c3A, c3B, c3C, c3D] = c3ValidList[c3ValidIdx];
    updateC3Display();
    rebuildKnot();
  }
});

// ── Flip ───────────────────────────────────────────────────────────────────
// Reflect the flat knot vertically (y → MAX_Y − y): upside-down in the flat
// diagram/braid, inner/outer swapped in the round/knot views (the opposite end
// of the flat↔cylinder slider).  The flipped knot is a different valid
// combination; we recompute it and point the counter at the matching list entry
// so a second press returns to the original.  Disabled for C=1 (no parameters).
//
// Canonical signature of a C=3 segment sequence under the same equivalence used
// by findSameYSets: even rotations (preserve asc/desc) of the sequence and of
// its reversal (the closed zigzag traversed backwards).
function c3CanonKey(seq) {
  const evenRots = a => [
    [a[0],a[1],a[2],a[3],a[4],a[5]],
    [a[2],a[3],a[4],a[5],a[0],a[1]],
    [a[4],a[5],a[0],a[1],a[2],a[3]],
  ];
  const rev = [seq[5],seq[4],seq[3],seq[2],seq[1],seq[0]];
  return [...evenRots(seq), ...evenRots(rev)].map(r => r.join(',')).sort()[0];
}

// C=3 segment sequences for an entry and its vertical flip (odd rotation).
function c3Seq(a, b, c, d, m)      { const L3 = 3*m; return [L3-c-d, a, d, b, c, L3-a-b]; }
function c3FlipSeq(a, b, c, d, m)  { const L3 = 3*m; return [a, d, b, c, L3-a-b, L3-c-d]; }

// True when flipping leaves the knot unchanged (flip would be a no-op).
function flipIsNoOp() {
  if (currentC === 1) return true;
  const m = parseInt(document.getElementById('mInput').value);
  if (currentC === 2) return ab2ValidList.length === 0 || currentA === currentB;
  if (c3ValidList.length === 0) return true;
  return c3CanonKey(c3Seq(c3A, c3B, c3C, c3D, m)) ===
         c3CanonKey(c3FlipSeq(c3A, c3B, c3C, c3D, m));
}

function updateFlipButton() {
  document.getElementById('flipToggle').disabled = flipIsNoOp();
}

// Number of distinct knots/links for the current C and L: flip pairs count once,
// self-flip (flip-disabled) knots count once → (N + selfFlipCount) / 2.
function countDistinctKnots() {
  // Lists are now deduped up to mirror, so each entry is one distinct knot.
  if (currentC === 1) return 1;
  if (currentC === 2) return ab2ValidList.length;
  return c3ValidList.length;
}

function flipKnot() {
  // Mirrors are deduped out of the list, so flip renders the mirror image in
  // place (counter unchanged) via the knotFlipped flag; flipping twice returns
  // to the representative.  setKnotFromUI applies it (swap a,b for C=2; the
  // stored mirror tuple for C=3).
  if (currentC === 1 || flipIsNoOp()) return;
  knotFlipped = !knotFlipped;
  rebuildKnot();
}
document.getElementById('flipToggle').addEventListener('click', flipKnot);

// ── Diagram view ───────────────────────────────────────────────────────────
// Multi-component version: result[c] is a Map segIndex → [{t, isUnder}]
function computeDiagramCrossingsAll(components, mod) {
  const nC = components.length;
  const seen = new Map();
  for (let ci = 0; ci < nC; ci++) {
    const bP = components[ci], np = bP.length;
    for (let p = 0; p < np; p++) {
      const [ax, ay] = bP[p];
      if (bP[(p+1)%np][1] - ay <= 0) continue;
      const dxp = bP[(p+1)%np][1] - ay;
      for (let cj = 0; cj < nC; cj++) {
        const bQ = components[cj], nq = bQ.length;
        for (let q = 0; q < nq; q++) {
          const [cx, cy] = bQ[q];
          if (bQ[(q+1)%nq][1] - cy >= 0) continue;
          const dxq = cy - bQ[(q+1)%nq][1];
          const diffY = cy - ay;
          for (let t = 1; t < dxp; t++) {
            const u = diffY - t;
            if (u <= 0 || u >= dxq) continue;
            if ((ax + t) % mod !== (cx + u) % mod) continue;
            const key = `${(ax+t)%mod},${ay+t}`;
            if (!seen.has(key))
              seen.set(key, {ci, p, t, cj, q, u, x:(ax+t)%mod, y:ay+t});
          }
        }
      }
    }
  }
  const list = [...seen.values()];
  if (nC === 1) {
    const bP = components[0], n = bP.length;
    const cumLen = [0];
    for (let i = 0; i < n; i++)
      cumLen.push(cumLen[i] + Math.abs(bP[(i+1)%n][1] - bP[i][1]));
    const isOver = alternatingOverUnder(list.map(cr => cumLen[cr.p] + cr.t),
                                        list.map(cr => cumLen[cr.q] + cr.u));
    list.forEach((cr, i) => { cr.pIsOver = isOver[i]; });
  } else {
    const yRank = new Map([...new Set(list.map(cr => cr.y))].sort((a,b) => a-b).map((y,i) => [y,i]));
    list.forEach(cr => { cr.pIsOver = (yRank.get(cr.y) % 2 === 0); });
  }
  const forFlip = list.map(cr => ({p:cr.p, q:cr.q, tP:cr.t, tQ:cr.u, pIsOver:cr.pIsOver}));
  if (needsParityFlip(forFlip)) list.forEach(cr => { cr.pIsOver = !cr.pIsOver; });
  const result = components.map(() => new Map());
  list.forEach(({ci, p, t, cj, q, u, pIsOver}) => {
    if (!result[ci].has(p)) result[ci].set(p, []);
    if (!result[cj].has(q)) result[cj].set(q, []);
    result[ci].get(p).push({t,    isUnder: !pIsOver});
    result[cj].get(q).push({t: u, isUnder:  pIsOver});
  });
  result.crossingCount = list.length;
  return result;
}

  setViewButtons('braid');
  document.getElementById('diagRoundRow').style.display = 'none';
  document.getElementById('flatCylSection').style.display = 'none';
  document.getElementById('knotSliders').style.display = '';
  setThickMax(0.28);   // knot & braid cap (~62% of the full 0.45 range)
  document.getElementById('xStretchSection').style.display = '';
  document.getElementById('roundSection').style.display = 'none';
  document.getElementById('straightSection').style.display = 'none';
  document.getElementById('downloadBtn').style.display = 'none';
  document.getElementById('pdfDownloadBtn').style.display = 'none';
  document.getElementById('bInput').disabled = true;
  document.getElementById('bightsToggle').disabled = false;
  const ct = document.getElementById('componentToggle');
  ct.disabled = false;
  ct.textContent = componentMode ? 'Full' : 'Solo';
  buildTubeDiagram();
}

function drawDiagram() {
  const B   = parseInt(document.getElementById('bInput').value);
  const mod = 2 * currentC * B;

  diagramCanvas.width  = innerWidth;
  diagramCanvas.height = innerHeight;
  const ctx = diagramCanvas.getContext('2d');

  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  // Scale depends only on leads (LEADS = m): more leads → smaller unit.
  // ox is fixed just right of the panel; right edge is fixed at screen right.
  const PANEL_W  = 235;
  const LABEL_W  = 40;
  const padR     = 30;
  const diagH    = innerHeight * 0.75;
  const scale    = diagH / Math.max(MAX_Y, 2 * LEADS);
  const xStretch = parseFloat(document.getElementById('xStretchSlider').value);
  const scaleX   = scale * xStretch;
  const ox       = PANEL_W + LABEL_W;
  const availDiagW = innerWidth - ox - padR;
  const REPS     = Math.max(1, Math.ceil(availDiagW / (mod * scaleX)));
  const rStart   = componentMode ? 0 : -Math.ceil(PERIOD / mod);
  const drawReps = componentMode ? 1 : REPS;
  const totalW   = mod * REPS;
  const oy       = (innerHeight + MAX_Y * scale) / 2;

  const diagOffset = scaleX * 0.5; // shift so seam lines don't land on integer coords
  const px = x => ox + diagOffset + x * scaleX;
  const py = y => oy - y * scale;

  // Clip everything to the fixed diagram rectangle.
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, py(MAX_Y), availDiagW, MAX_Y * scale);
  ctx.clip();

  // All grid lines the same dim colour, stepping by 2 (all bight feet are even).
  ctx.strokeStyle = 'rgba(100,130,255,0.55)';
  ctx.lineWidth = 1;
  const kStart = Math.ceil(-MAX_Y / 2) * 2;
  for (let k = kStart; k <= totalW; k += 2) {
    ctx.beginPath();
    ctx.moveTo(px(k),         py(0));
    ctx.lineTo(px(k + MAX_Y), py(MAX_Y));
    ctx.stroke();
  }
  for (let k = 0; k <= totalW + MAX_Y; k += 2) {
    ctx.beginPath();
    ctx.moveTo(px(k),         py(0));
    ctx.lineTo(px(k - MAX_Y), py(MAX_Y));
    ctx.stroke();
  }

  ctx.restore();

  // Bight-row guide lines spanning all repetitions
  const rows = [...new Set([0, ...ZIGZAG.map(p => p[1])])].sort((a, b) => a - b);
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 1;
  for (const y of rows) {
    ctx.strokeStyle = 'rgba(100,130,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(px(0), py(y));
    ctx.lineTo(px(totalW), py(y));
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,205,255,0.75)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`y=${y}`, ox - 6, py(y) + 4);
  }
  ctx.setLineDash([]);

  // Cylinder-seam markers — extend 25px above and below the diagram.
  ctx.strokeStyle = 'rgba(160,185,255,0.75)';
  ctx.lineWidth = 1.5;
  for (let r = 0; r <= REPS; r++) {
    const sx = px(r * mod);
    ctx.beginPath();
    ctx.moveTo(sx, py(0)     + 25);
    ctx.lineTo(sx, py(MAX_Y) - 25);
    ctx.stroke();
  }

  const components   = generateAllComponents(B);
  const g            = components.length;
  const allCrossings = computeDiagramCrossingsAll(components, mod);
  updateInfo(B, g, allCrossings.crossingCount);

  // Precompute geometry for all components.
  // allSegs[comp][r][i][s] = {x1s, y1s, x2s, y2s, hue, gapF, underFs, overFs}
  const drawComponents = componentMode ? components.slice(0, 1) : components;
  const allSegs = drawComponents.map((bights, comp) => {
    const crossMap = allCrossings[comp];
    const n        = bights.length;
    const numZigs  = componentMode ? 1 : Math.floor(n / D);
    const segs = [];
    for (let r = rStart; r < drawReps; r++) {
      const xOff = r * mod;
      const rSegs = [];
      for (let i = 0; i < numZigs; i++) {
        const hue = `hsl(${(comp / g + i / numZigs / g) * 360},90%,65%)`;
        let cumX = bights[i * D][0];
        const iSegs = [];
        for (let s = 0; s < D; s++) {
          const idx = i * D + s;
          const nxt = (idx + 1) % n;
          const [, ay] = bights[idx];
          const [, by] = bights[nxt];
          const dx = Math.abs(by - ay);
          const x1s = px(cumX + xOff), y1s = py(ay);
          const x2s = px(cumX + xOff + dx), y2s = py(by);
          const segLen = Math.hypot(x2s - x1s, y2s - y1s);
          const gapF   = segLen > 0 ? 8 / segLen : 0;
          const crosses = crossMap.get(idx) || [];
          const underFs = crosses.filter(cr =>  cr.isUnder).map(cr => cr.t / dx);
          const overFs  = crosses.filter(cr => !cr.isUnder).map(cr => cr.t / dx);
          iSegs.push({x1s, y1s, x2s, y2s, hue, gapF, underFs, overFs});
          cumX += dx;
        }
        rSegs.push(iSegs);
      }
      segs.push(rSegs);
    }
    return segs;
  });

  // Zigzag lines and bight dots — clipped to the diagram rectangle.
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, py(MAX_Y), availDiagW, MAX_Y * scale);
  ctx.clip();

  // Pass 1: draw all segments for all components
  for (const segs of allSegs)
    for (const rSegs of segs)
      for (const iSegs of rSegs)
        for (const {x1s, y1s, x2s, y2s, hue} of iSegs) {
          ctx.lineWidth = 2; ctx.strokeStyle = hue;
          ctx.beginPath(); ctx.moveTo(x1s, y1s); ctx.lineTo(x2s, y2s); ctx.stroke();
        }

  // Pass 2: erase all under-crossings for all components
  ctx.strokeStyle = '#060610'; ctx.lineWidth = 5;
  for (const segs of allSegs)
    for (const rSegs of segs)
      for (const iSegs of rSegs)
        for (const {x1s, y1s, x2s, y2s, gapF, underFs} of iSegs)
          for (const tf of underFs) {
            const f0 = Math.max(0, tf - gapF), f1 = Math.min(1, tf + gapF);
            ctx.beginPath();
            ctx.moveTo(x1s + f0*(x2s-x1s), y1s + f0*(y2s-y1s));
            ctx.lineTo(x1s + f1*(x2s-x1s), y1s + f1*(y2s-y1s));
            ctx.stroke();
          }

  // Pass 3: thicken all over-crossings for all components
  ctx.lineWidth = 4;
  for (const segs of allSegs)
    for (const rSegs of segs)
      for (const iSegs of rSegs)
        for (const {x1s, y1s, x2s, y2s, hue, gapF, overFs} of iSegs) {
          ctx.strokeStyle = hue;
          for (const tf of overFs) {
            const f0 = Math.max(0, tf - gapF), f1 = Math.min(1, tf + gapF);
            ctx.beginPath();
            ctx.moveTo(x1s + f0*(x2s-x1s), y1s + f0*(y2s-y1s));
            ctx.lineTo(x1s + f1*(x2s-x1s), y1s + f1*(y2s-y1s));
            ctx.stroke();
          }
        }

  // Bight dots and labels for all components
  ctx.textAlign = 'center';
  for (let comp = 0; comp < g; comp++) {
    const bights = components[comp];
    const n      = bights.length;
    const bightLabel = new Array(n);
    const byY = new Map();
    for (let j = 0; j < n; j++) {
      const y = bights[j][1];
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(j);
    }
    for (const group of byY.values()) {
      group.sort((a, b) => bights[a][0] - bights[b][0]);
      group.forEach((j, idx) => { bightLabel[j] = idx; });
    }
    for (let r = rStart; r < REPS; r++) {
      const xOff = r * mod;
      for (let j = 0; j < n; j++) {
        const [x, y] = bights[j];
        const sx = px(x + xOff), sy = py(y);
        const prevY = bights[(j - 1 + n) % n][1];
        const nextY = bights[(j + 1) % n][1];
        const isTop = prevY < y && nextY < y;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(255,240,160,0.95)';
        ctx.fillText(String(bightLabel[j]), sx, isTop ? sy + 23 : sy - 16);
      }
    }
  }
  ctx.restore();

  // C=3 parameter rulers — only in component (Period) mode.
  // Endpoints are where adjacent same-slope segment lines cross the ruler's own y-level.
  if (currentC === 3 && componentMode) {
    const qtrY = py(MAX_Y * 0.25);
    const rulers = [
      { y: qtrY - 10, spans: [{ name: `2a=${2*c3A}`, color: 'rgba(255,140,60,0.9)',  s0: 0, s1: 2 },
                               { name: `2b=${2*c3B}`, color: 'rgba(255,220,60,0.9)',  s0: 2, s1: 4 }] },
      { y: qtrY + 10, spans: [{ name: `2d=${2*c3D}`, color: 'rgba(80,210,180,0.9)', s0: 1, s1: 3 },
                               { name: `2c=${2*c3C}`, color: 'rgba(120,170,255,0.9)', s0: 3, s1: 5 }] },
    ];
    const tickH = 5;
    const comp0 = components[0];
    const n0    = comp0.length;
    let cumX = comp0[0][0];
    const xs = [cumX], ys = [comp0[0][1]];
    for (let s = 0; s < D; s++) {
      const [, ay] = comp0[s];
      const [, by] = comp0[(s + 1) % n0];
      cumX += Math.abs(by - ay);
      xs.push(cumX);
      ys.push(by);
    }
    // x where segment s's line crosses diagram y-level yDiag
    const xAtLevel = (s, yDiag) => s % 2 === 0
      ? xs[s] + (yDiag - ys[s])   // ascending slope +1
      : xs[s] - (yDiag - ys[s]);  // descending slope -1

    ctx.font = '15px monospace';
    ctx.textAlign = 'center';
    for (const { y: rulerY, spans } of rulers) {
      const yDiag = (oy - rulerY) / scale;
      for (const { name, color, s0, s1 } of spans) {
        const rx0 = px(xAtLevel(s0, yDiag));
        const rx1 = px(xAtLevel(s1, yDiag));
        if (rx1 < ox || rx0 > ox + availDiagW) continue;
        const crx0 = Math.max(rx0, ox);
        const crx1 = Math.min(rx1, ox + availDiagW);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(crx0, rulerY); ctx.lineTo(crx1, rulerY); ctx.stroke();
        if (rx0 >= ox)              { ctx.beginPath(); ctx.moveTo(rx0, rulerY - tickH); ctx.lineTo(rx0, rulerY + tickH); ctx.stroke(); }
        if (rx1 <= ox + availDiagW) { ctx.beginPath(); ctx.moveTo(rx1, rulerY - tickH); ctx.lineTo(rx1, rulerY + tickH); ctx.stroke(); }
        if (rx1 - rx0 > 20) {
          ctx.fillStyle = color;
          ctx.fillText(name, (crx0 + crx1) / 2, rulerY - tickH - 2);
        }
      }
    }
  }

  // C=2 parameter rulers — vertical, only in component (Period) mode.
  // 2a: from y=0 (first v bight) to y=2a (third v bight), at x midpoint of bights 0 and 2.
  // 2b: from y=m+a-b (first ^ bight) to y=m+a+b (fourth ^ bight), at x midpoint of bights 1 and 3.
  if (currentC === 2 && componentMode) {
    const comp0 = components[0];
    const n0    = comp0.length;
    let cumX = comp0[0][0];
    const xs = [cumX], ys = [comp0[0][1]];
    for (let s = 0; s < D; s++) {
      const [, ay] = comp0[s];
      const [, by] = comp0[(s + 1) % n0];
      cumX += Math.abs(by - ay);
      xs.push(cumX);
      ys.push(by);
    }
    const rulers2 = [
      { x: (xs[0] + xs[2]) / 2, y0: ys[0], y1: ys[2], name: `2a=${2*currentA}`, color: 'rgba(255,140,60,0.9)',  skip: currentA === 0 },
      { x: (xs[1] + xs[3]) / 2, y0: ys[1], y1: ys[3], name: `2b=${2*currentB}`, color: 'rgba(255,220,60,0.9)', skip: currentB === 0 },
    ];
    const tickW = 5;
    ctx.font = '15px monospace';
    ctx.textAlign = 'left';
    for (const { x, y0, y1, name, color, skip } of rulers2) {
      if (skip) continue;
      const rx  = px(x);
      const ry0 = py(y0);  // canvas y for lower diagram y (further down on screen)
      const ry1 = py(y1);  // canvas y for higher diagram y (further up on screen)
      if (rx < ox || rx > ox + availDiagW) continue;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(rx, ry0); ctx.lineTo(rx, ry1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx - tickW, ry0); ctx.lineTo(rx + tickW, ry0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx - tickW, ry1); ctx.lineTo(rx + tickW, ry1); ctx.stroke();
      if (Math.abs(ry1 - ry0) > 16) {
        ctx.fillStyle = color;
        ctx.fillText(name, rx + tickW + 3, (ry0 + ry1) / 2 + 4);
      }
    }
  }

  // x-axis tick labels every 2 units below diagram, and above starting at first top-row bight
  ctx.fillStyle = 'rgba(180,205,255,0.75)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  const xStep    = 2;
  const topBight = components[0].find(([, y]) => y === MAX_Y);
  const topStart = topBight ? topBight[0] % xStep : 0;
  for (let x = 0; x <= totalW; x += xStep) {
    const sx = px(x);
    if (sx < ox || sx > ox + availDiagW) continue;
    ctx.fillText(String(x % mod), sx, py(0) + 14);
  }
  for (let x = topStart; x <= totalW; x += xStep) {
    const sx = px(x);
    if (sx < ox || sx > ox + availDiagW) continue;
    ctx.fillText(String(x % mod), sx, py(MAX_Y) - 6);
  }

  // Info line below the diagram: mod | zigzag | crossings
  const infoY = py(0) + 44;
  ctx.font = '13px monospace';
  ctx.fillStyle = 'rgba(180,205,255,0.75)';
  ctx.textAlign = 'left';
  ctx.fillText(`mod = ${mod}`, ox, infoY);
  ctx.textAlign = 'center';
  ctx.fillText(ZIGZAG.map(([x,y]) => `(${x},${y})`).join(' → '), ox + availDiagW / 2, infoY);
  ctx.textAlign = 'right';
  ctx.fillText(`${allCrossings.crossingCount} crossings`, ox + availDiagW, infoY);
}

function drawRoundDiagram() {
  const B   = parseInt(document.getElementById('bInput').value);
  const mod = 2 * currentC * B;

  diagramCanvas.width  = innerWidth;
  diagramCanvas.height = innerHeight;
  const ctx = diagramCanvas.getContext('2d');
  ctx.fillStyle = '#060610';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  const PANEL_W = 235;
  const cx = (innerWidth + PANEL_W) / 2;
  const cy = innerHeight / 2;
  const innerR = parseFloat(document.getElementById('roundInnerSlider').value);
  const outerR = parseFloat(document.getElementById('roundOuterSlider').value);

  // Abstract (rawX, y) → canvas. Uses full mod period for one circle,
  // so all mod bights land at distinct angular positions.
  const toC = (rawX, y) => {
    const theta = (rawX / mod) * 2 * Math.PI - Math.PI / 2;
    const r = innerR + (y / MAX_Y) * (outerR - innerR);
    return [cx + r * Math.cos(theta), cy + r * Math.sin(theta)];
  };

  // Concentric circles and radial lines — same style as flat diagram diagonal grid
  const zigzagYs = new Set([0, ...ZIGZAG.map(p => p[1])]);
  ctx.strokeStyle = 'rgba(100,130,255,0.55)';
  ctx.lineWidth = 1;

  for (let y = 0; y <= MAX_Y; y++) {
    const r = innerR + (y / MAX_Y) * (outerR - innerR);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
  }

  for (let x = 0; x < mod; x++) {
    const [x1, y1] = toC(x, 0);
    const [x2, y2] = toC(x, MAX_Y);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // X-value labels outside the outer circle, one per radius
  ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180,205,255,0.75)';
  for (let x = 0; x < mod; x++) {
    const theta = (x / mod) * 2 * Math.PI - Math.PI / 2;
    const ar = outerR + 16;
    ctx.fillText(String(x), cx + ar * Math.cos(theta), cy + ar * Math.sin(theta) + 4);
  }

  // Y-value labels along x=0 radius (top of diagram)
  ctx.textAlign = 'left'; ctx.font = '10px monospace';
  for (let y = 0; y <= MAX_Y; y++) {
    ctx.fillStyle = zigzagYs.has(y) ? 'rgba(255,240,160,0.9)' : 'rgba(180,205,255,0.5)';
    const [lx, ly] = toC(0, y);
    ctx.fillText(String(y), lx + 5, ly + 4);
  }

  const components   = generateAllComponents(B);
  const g            = components.length;
  const allCrossings = computeDiagramCrossingsAll(components, mod);
  updateInfo(B, g, allCrossings.crossingCount);
  const drawComponents = componentMode ? components.slice(0, 1) : components;

  // Precompute segments with cumulative raw x
  const STEPS = 8; // subdivisions per unit for curve smoothness

  const allSegs = drawComponents.map((bights, comp) => {
    const crossMap = allCrossings[comp];
    const n = bights.length;
    const numSegs = componentMode ? D : n;
    const numZigsR = Math.max(1, Math.floor(numSegs / D));
    const segs = [];
    let rawX = bights[0][0];
    for (let i = 0; i < numSegs; i++) {
      const ay = bights[i][1];
      const by = bights[(i+1)%n][1];
      const dx = Math.abs(by - ay);
      const zi = Math.floor(i / D);
      const hue = `hsl(${(comp/g + zi/numZigsR/g)*360},90%,65%)`;
      const crosses = crossMap.get(i) || [];
      const bx2 = rawX + dx;
      // Per-crossing gapF: 8px / local canvas arc speed at that crossing
      const crossGapF = (tf) => {
        const eps = 0.01, t0 = Math.max(0,tf-eps), t1 = Math.min(1,tf+eps);
        const [x0,y0] = toC(rawX+t0*(bx2-rawX), ay+t0*(by-ay));
        const [x1,y1] = toC(rawX+t1*(bx2-rawX), ay+t1*(by-ay));
        const spd = Math.hypot(x1-x0, y1-y0) / (t1-t0);
        return spd > 0 ? 8 / spd : 0.06;
      };
      const underCrs = crosses.filter(c =>  c.isUnder).map(c => ({tf: c.t/dx, gapF: crossGapF(c.t/dx)}));
      const overCrs  = crosses.filter(c => !c.isUnder).map(c => ({tf: c.t/dx, gapF: crossGapF(c.t/dx)}));
      const allCrossFs = [...underCrs, ...overCrs].map(c => c.tf).sort((a,b) => a-b);
      segs.push({rawX, ay, bx: bx2, by, dx, hue, underCrs, overCrs, allCrossFs});
      rawX += dx;
    }
    return segs;
  });

  const drawArc = (rawX1, ay, rawX2, by, n = STEPS) => {
    const [sx, sy] = toC(rawX1, ay); ctx.moveTo(sx, sy);
    for (let k = 1; k <= n; k++) {
      const f = k / n;
      const [px, py] = toC(rawX1 + f*(rawX2-rawX1), ay + f*(by-ay));
      ctx.lineTo(px, py);
    }
  };

  const drawGap = (rawX, ay, bx, by, f0, f1) => {
    const rx0 = rawX + f0*(bx-rawX), ry0 = ay + f0*(by-ay);
    const rx1 = rawX + f1*(bx-rawX), ry1 = ay + f1*(by-ay);
    ctx.beginPath(); drawArc(rx0, ry0, rx1, ry1, 4); ctx.stroke();
  };

  // Analytical canvas tangent at (rawXt, yt) for segment direction (dRawX, dY).
  const canvasTangent = (rawXt, yt, dRawX, dY) => {
    const theta = (rawXt / mod) * 2 * Math.PI - Math.PI / 2;
    const r     = innerR + (yt / MAX_Y) * (outerR - innerR);
    const dtheta = (dRawX / mod) * 2 * Math.PI;
    const dr     = (dY    / MAX_Y) * (outerR - innerR);
    return [dr*Math.cos(theta) - r*Math.sin(theta)*dtheta,
            dr*Math.sin(theta) + r*Math.cos(theta)*dtheta];
  };

  // Pass 1: cubic bezier per sub-segment — smooth arcs, sharp only at bights.
  ctx.lineWidth = 2;
  for (const segs of allSegs) {
    if (!segs.length) continue;
    for (let zi = 0; zi * D < segs.length; zi++) {
      const zigSegs = segs.slice(zi * D, (zi + 1) * D);
      ctx.strokeStyle = zigSegs[0].hue;
      ctx.beginPath();
      let first = true;
      for (const {rawX, ay, bx, by, allCrossFs} of zigSegs) {
        const dX = bx - rawX, dY = by - ay;
        const fracs = [0, ...allCrossFs, 1];
        for (let fi = 0; fi < fracs.length - 1; fi++) {
          const f0 = fracs[fi], f1 = fracs[fi + 1];
          const rX0 = rawX + f0*dX, y0 = ay + f0*dY;
          const rX1 = rawX + f1*dX, y1 = ay + f1*dY;
          const [px0, py0] = toC(rX0, y0);
          const [px1, py1] = toC(rX1, y1);
          const T0 = canvasTangent(rX0, y0, dX, dY);
          const T1 = canvasTangent(rX1, y1, dX, dY);
          const dt = f1 - f0;
          if (first) { ctx.moveTo(px0, py0); first = false; }
          ctx.bezierCurveTo(px0+T0[0]*dt/3, py0+T0[1]*dt/3,
                            px1-T1[0]*dt/3, py1-T1[1]*dt/3,
                            px1, py1);
        }
      }
      ctx.stroke();
    }
  }

  // Pass 2: erase under-crossings
  ctx.strokeStyle = '#060610'; ctx.lineWidth = 5;
  for (const segs of allSegs)
    for (const {rawX, ay, bx, by, underCrs} of segs)
      for (const {tf, gapF} of underCrs)
        drawGap(rawX, ay, bx, by, Math.max(0, tf-gapF), Math.min(1, tf+gapF));

  // Pass 3: thicken over-crossings
  ctx.lineWidth = 4;
  for (const segs of allSegs)
    for (const {rawX, ay, bx, by, hue, overCrs} of segs) {
      ctx.strokeStyle = hue;
      for (const {tf, gapF} of overCrs)
        drawGap(rawX, ay, bx, by, Math.max(0, tf-gapF), Math.min(1, tf+gapF));
    }

  // Bight dots and labels — one dot per bight, numbered within each y-level
  for (let comp = 0; comp < (componentMode ? 1 : g); comp++) {
    const bights = components[comp];
    const n = bights.length;
    const numBights = componentMode ? D + 1 : n;
    // Assign within-y-level index
    const byY = new Map();
    for (let j = 0; j < n; j++) {
      const y = bights[j][1];
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(j);
    }
    const bightLabel = new Array(n);
    for (const group of byY.values()) {
      group.sort((a, b) => bights[a][0] - bights[b][0]);
      group.forEach((j, idx) => { bightLabel[j] = idx; });
    }
    ctx.textAlign = 'center';
    for (let j = 0; j < numBights; j++) {
      const [x, y] = bights[j];
      const [bsx, bsy] = toC(x, y);
      const prevY = bights[(j - 1 + n) % n][1];
      const nextY = bights[(j + 1) % n][1];
      const isTop = prevY < y && nextY < y;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(bsx, bsy, 4, 0, Math.PI * 2); ctx.fill();
      ctx.font = '11px monospace';
      ctx.fillStyle = 'rgba(255,240,160,0.95)';
      ctx.fillText(String(bightLabel[j]), bsx, isTop ? bsy + 23 : bsy - 16);
    }
  }
}

function buildKnot() {
  knotGroup.scale.setScalar(1);   // straight view may have shrunk it
  while (knotGroup.children.length) {
    const child = knotGroup.children[0];
    child.geometry.dispose(); child.material.dispose(); knotGroup.remove(child);
  }
  knotGroup.rotation.set(0, 0, 0);

  const B          = parseInt(document.getElementById('bInput').value);
  const mod        = 2 * currentC * B;
  const tubeRadius = parseFloat(document.getElementById('thickInput').value);
  const delta      = tubeRadius;
  const innerR_raw = parseFloat(document.getElementById('roundInnerSlider').value);
  const outerR_raw = 260; // fixed reference size (sets the default on-screen scale); zoom adjusts

  // Camera half-height matches the braid view so tube radius looks the same
  // size at the same slider value.  pxToWorld converts slider pixel values to
  // world units using the same factor as the screen projection, so the rings
  // appear at exactly the same pixel radii as in the round diagram.
  // The center shifts right by PANEL_W/2 px to match the round diagram's cx.
  const PANEL_W   = 235;
  const aspect    = innerWidth / innerHeight;
  const camR      = 6.5;
  const pxToWorld = 2 * camR / innerHeight;
  const worldOuterR = outerR_raw * pxToWorld;
  const worldInnerR = innerR_raw * pxToWorld;
  const xCenter     = PANEL_W * camR / innerHeight;
  orthoCamera.left   = -camR * aspect;
  orthoCamera.right  =  camR * aspect;
  orthoCamera.top    =  camR;
  orthoCamera.bottom = -camR;
  orthoCamera.updateProjectionMatrix();

  // Slider: 0 = flat, 0.5 = cylinder, 1 = flat again.  vt is the cylinder amount
  // (0→1→0).  The right half (rev) unrolls the cylinder from the opposite base:
  // the radius mapping reverses (MAX_Y - y) so the inner and outer rings swap,
  // giving the opposite flat knot.  theta is NOT mirrored, so the strands never
  // collapse to a line and the cylinder never tumbles through 3D — it just opens
  // back into the plane the other way.  At s=0.5 vt=1, so the flat term is
  // weighted to zero and the rev switch is continuous.
  const sVal   = parseFloat(document.getElementById('viewSlider').value);
  const vt      = 1 - Math.abs(2 * sVal - 1);
  const rev     = sVal > 0.5;
  // Tilt the view with the slider: flat ends seen from above (no tilt), the
  // cylinder (middle) rotated 90° about x so it's seen from the side.  Composes
  // with manual orbit (OrbitControls drives the camera, this rotates the knot).
  knotGroup.rotation.x = -vt * Math.PI / 2;
  // Cylinder height scales with the row count MAX_Y, calibrated so the strands
  // sit at ~45° on the surface (square cells: height/MAX_Y == circumference/mod,
  // circumference = 2*pi*worldOuterR — the constant cylinder radius).  Capped a
  // bit below camR so the full height (2*h_half) stays just inside the screen
  // height (frustum +/-camR).
  const h_half = Math.min(Math.PI * worldOuterR * MAX_Y / mod, camR * 0.85);

  const toR = (rawX, y, z = 0) => {
    const theta  = (rawX / mod) * 2 * Math.PI - Math.PI / 2;
    const yR     = rev ? (MAX_Y - y) : y;          // swap inner/outer on the right
    const r_flat = worldInnerR + (yR / MAX_Y) * (worldOuterR - worldInnerR);
    // Flat state: radius r_flat in plane, crossing offset axial (+z).
    // Cylinder state: radius = the (fixed) OUTER ring; the roll grows the inner
    // ring out to meet it, so the cylinder radius is the constant worldOuterR and
    // the inner-radius slider has no effect in cylinder view (only off-cylinder,
    // where it sets the inner ring).  Crossing offset radial.
    const fx = r_flat * Math.cos(theta) + xCenter;
    const fy = r_flat * Math.sin(theta);
    const fz = z;
    const cx = (worldOuterR + z) * Math.cos(theta);
    const cy = (worldOuterR + z) * Math.sin(theta);
    const cz = (y / MAX_Y - 0.5) * 2 * h_half;
    return new THREE.Vector3(
      fx * (1 - vt) + cx * vt,
      fy * (1 - vt) + cy * vt,
      fz * (1 - vt) + cz * vt
    );
  };

  const components     = generateAllComponents(B);
  const g              = components.length;
  const allCrossings   = computeDiagramCrossingsAll(components, mod);
  updateInfo(B, g, allCrossings.crossingCount);
  const ct = document.getElementById('componentToggle');
  if (g === 1) { componentMode = false; ct.disabled = true; }
  else         { ct.disabled = false; }
  ct.textContent = componentMode ? 'Full' : 'Solo';
  const drawComponents = componentMode ? components.slice(0, 1) : components;

  const tmp        = new THREE.Color();
  const radialSegs = 24;

  for (let comp = 0; comp < drawComponents.length; comp++) {
    const bights   = drawComponents[comp];
    const n        = bights.length;
    const crossMap = allCrossings[comp];
    const numSegs  = n;
    const closed   = true;

    // STEPS arc samples per sub-segment so CatmullRom follows the polar arc.
    const STEPS    = 8;
    const bightSep = 0.3;  // radial nudge to separate coincident v/^ bights

    // Bight points shared by more than one bight (a v-bight and a ^-bight at the
    // same (x,y)) get pushed apart so they're visually distinguishable.
    const ptCount = new Map();
    for (const [bx, by] of bights) {
      const key = `${bx},${by}`;
      ptCount.set(key, (ptCount.get(key) || 0) + 1);
    }
    const sharedPts = new Set([...ptCount].filter(([, c]) => c > 1).map(([k]) => k));

    const pts = [];
    let rawX = bights[0][0];

    // Per-bight radial displacement: coincident v/^ bights get nudged apart.
    const bightDisp = bights.map((b, i) => {
      const d = Math.sign(bights[(i + 1) % n][1] - b[1]);
      return sharedPts.has(`${b[0]},${b[1]}`) ? d * bightSep : 0;
    });

    for (let i = 0; i < numSegs; i++) {
      const ay     = bights[i][1];
      const by     = bights[(i + 1) % n][1];
      const dx     = Math.abs(by - ay);
      const crosses = (crossMap.get(i) || []).slice().sort((a, b) => a.t - b.t);

      const keyFs = [0, ...crosses.map(c => c.t / dx)];
      const keyZs = [0, ...crosses.map(c => c.isUnder ? -delta : delta)];

      // Linear taper of the displacement from this bight to the next, so the
      // path eases toward a displaced tip instead of spiking to it.
      const dispA = bightDisp[i];
      const dispB = bightDisp[(i + 1) % n];
      const yAt   = f => ay + f * (by - ay) + dispA * (1 - f) + dispB * f;

      for (let ki = 0; ki < keyFs.length; ki++) {
        const f0 = keyFs[ki];
        const f1 = ki + 1 < keyFs.length ? keyFs[ki + 1] : 1.0;
        const z0 = keyZs[ki];
        const z1 = ki + 1 < keyFs.length ? keyZs[ki + 1] : 0;

        pts.push(toR(rawX + f0 * dx, yAt(f0), z0));

        // Dense arc samples up to (but not including) the next key point.
        for (let s = 1; s < STEPS; s++) {
          const f = f0 + (f1 - f0) * s / STEPS;
          pts.push(toR(rawX + f * dx, yAt(f), z0 + (z1 - z0) * s / STEPS));
        }
      }
      rawX += dx;
    }

    if (pts.length < 2) continue;

    const curve   = new THREE.CatmullRomCurve3(pts, closed, 'centripetal', 0.5);
    const tubSegs = Math.max(pts.length * 4, 60);
    const geo     = new THREE.TubeGeometry(curve, tubSegs, tubeRadius, radialSegs, closed);
    const ringCount    = tubSegs + 1;
    const vertsPerRing = radialSegs + 1;
    const cols         = new Float32Array(ringCount * vertsPerRing * 3);
    // Knots (g=1): full rainbow gradient along the tube; links: flat hue per component.
    for (let i = 0; i < ringCount; i++) {
      tmp.setHSL(g === 1 ? i / tubSegs : comp / g, 0.9, 0.62);
      for (let j = 0; j < vertsPerRing; j++) {
        const idx = (i * vertsPerRing + j) * 3;
        cols[idx] = tmp.r; cols[idx+1] = tmp.g; cols[idx+2] = tmp.b;
      }
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      vertexColors: true, specular: new THREE.Color(0x444444), shininess: 40,
    }));
    mesh.frustumCulled = false;
    knotGroup.add(mesh);
  }

  if (showBights) {
    const sphereR   = tubeRadius * 0.75;
    const sphereGeo = new THREE.SphereGeometry(sphereR, 8, 8);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
    for (let comp = 0; comp < drawComponents.length; comp++) {
      const bights  = drawComponents[comp];
      const n       = bights.length;
      let rawX = bights[0][0];
      for (let i = 0; i < n; i++) {
        const ay = bights[i][1];
        const by = bights[(i + 1) % n][1];
        const dx = Math.abs(by - ay);
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.copy(toR(rawX, ay));
        sphere.frustumCulled = false;
        sphere.renderOrder = 1;  // draw after tubes so depthTest:false shows them on top
        knotGroup.add(sphere);
        rawX += dx;
      }
    }
  }
}
